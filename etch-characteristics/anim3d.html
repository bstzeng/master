<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>Etch characteristics 3D GIF renderer</title>
<style>
  body { margin: 0; background: #05070d; }
  canvas { display: block; }
</style>
<script type="importmap">
  { "imports": { "three": "../nanosheet/vendor/three/three.module.min.js", "three/addons/": "../nanosheet/vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="out" width="800" height="450"></canvas>
<script type="module">
// 蝕刻製程特性與機台狀態課的 3D 場景：與 nanosheet/anim3d.html 共用同一套繪製核心與 three.js（../nanosheet/vendor）。
// 需要用 http 伺服器開啟（ES module 不能用 file://）。預覽：etch-characteristics/anim3d.html#first-wafer
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const W = 800, H = 450; // 版面座標（所有位置都用這個尺寸寫）
// 輸出倍率：?scale=2.4 → 1920×1080（1080P）；預設 1 → 800×450 預覽
const S = parseFloat(new URLSearchParams(location.search).get("scale") || "1");
const FONT = '"Noto Sans TC", "Noto Sans CJK TC", sans-serif';
const MONO = '"DejaVu Sans Mono", "DM Mono", monospace';
const C = { cyan: "#22e5ff", magenta: "#ff3df2", lime: "#b6ff3d", red: "#ff4d5e", amber: "#ffb340", orange: "#ffa04d", green: "#5dffb0", blue: "#5aa0ff", yellow: "#ffd23d", grey: "#c8ced8", text: "#e8f6ff", dim: "rgba(232,246,255,.62)" };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (k) => { k = clamp(k); return k * k * (3 - 2 * k); };
const seg = (v, a, b) => ease((v - a) / (b - a)); // v 在 a..b 之間的平滑進度
const fract = (v) => v - Math.floor(v);
const rnd = (i) => fract(Math.sin(i * 127.1 + 311.7) * 43758.5453);
const lerp = (a, b, k) => a + (b - a) * k;
const tri = (v) => 1 - 4 * Math.abs(fract(v) - 0.5); // -1..1 三角波（彈跳用）

// ---------- three.js ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(S);
renderer.setSize(W, H);
renderer.setClearColor(0x05070d, 1);
const glCanvas = renderer.domElement;
const hud = document.createElement("canvas");
hud.width = W * S; hud.height = H * S;
const hctx = hud.getContext("2d");
hctx.setTransform(S, 0, 0, S, 0, 0);
const out = document.getElementById("out");
out.width = W * S; out.height = H * S;
const octx = out.getContext("2d");

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x05070d, 24, 44);
const camera = new THREE.PerspectiveCamera(36, W / H, 0.1, 100);
scene.add(new THREE.AmbientLight(0x8fb4ff, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(6, 12, 8);
scene.add(key);
const rim = new THREE.DirectionalLight(0xff3df2, 0.6);
rim.position.set(-8, 4, -6);
scene.add(rim);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.9, 0.45, 0.55));
composer.addPass(new OutputPass());
composer.setPixelRatio(S);
const grid = new THREE.GridHelper(60, 60, 0x0e3a4a, 0x0a2230);
grid.position.y = -2.01;
scene.add(grid);

// 材料顏色（面, 邊）
const M = {
  sub: [0x0f1a2c, 0x2c4a6e], sti: [0x2a3a55, 0x4a6a95], si: [0x1d78c0, 0x4fc3ff], sige: [0xd9822b, 0xffa04d],
  poly: [0x7c828c, 0xc8ced8], spacer: [0x1f9e6a, 0x5dffb0], inner: [0x14c88a, 0x8dffd0], sd: [0x2a5fd0, 0x5aa0ff],
  hik: [0xffd23d, 0xffe680], gate: [0xb02cc0, 0xff3df2],
};

// 單位方塊：用 set(x0,y0,z0,x1,y1,z1) 改尺寸位置，任何一邊為 0 就隱藏
function mbox(parent, [face, edge], { opacity = 1, emissive = 0x000000, ei = 0, edges = true } = {}) {
  const g = new THREE.BoxGeometry(1, 1, 1);
  const mat = new THREE.MeshStandardMaterial({ color: face, transparent: opacity < 1, opacity, roughness: 0.45, metalness: 0.1, emissive, emissiveIntensity: ei, depthWrite: opacity >= 1 });
  const mesh = new THREE.Mesh(g, mat);
  parent.add(mesh);
  let lines = null;
  if (edges) { lines = new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({ color: edge, transparent: true, opacity: 0.95 })); mesh.add(lines); }
  const base = { opacity, line: 0.95 };
  const api = {
    mesh, mat, lines,
    set(x0, y0, z0, x1, y1, z1) {
      const sx = x1 - x0, sy = y1 - y0, sz = z1 - z0;
      if (sx < 1e-3 || sy < 1e-3 || sz < 1e-3) { mesh.visible = false; return api; }
      mesh.visible = true;
      mesh.scale.set(sx, sy, sz);
      mesh.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
      return api;
    },
    alpha(a) { // 0..1 淡入淡出
      mat.transparent = true; mat.opacity = base.opacity * a; mat.depthWrite = a >= 1 && base.opacity >= 1;
      if (lines) lines.material.opacity = base.line * a;
      if (a <= 0.001) mesh.visible = false;
      return api;
    },
    hide() { mesh.visible = false; return api; },
  };
  return api;
}

// 發光粒子（電子、自由基）
function particles(parent, count, color, r = 0.1) {
  const mesh = new THREE.InstancedMesh(new THREE.SphereGeometry(r, 10, 8), new THREE.MeshBasicMaterial({ color }), count);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  parent.add(mesh);
  return mesh;
}
const tmp = new THREE.Object3D();
function place(mesh, list) {
  const n = Math.min(list.length, mesh.count);
  for (let i = 0; i < n; i++) { const [x, y, z, s = 1] = list[i]; tmp.position.set(x, y, z); tmp.scale.setScalar(s); tmp.updateMatrix(); mesh.setMatrixAt(i, tmp.matrix); }
  tmp.scale.setScalar(0); tmp.updateMatrix();
  for (let i = n; i < mesh.count; i++) mesh.setMatrixAt(i, tmp.matrix);
  mesh.instanceMatrix.needsUpdate = true;
}

// 導通電子流：閘極開啟時才進入通道（關閉後已在通道內的電子跑完）
function stream(list, { n, seed, t, speed, x0, x1, lane, gate = () => true, axis = "x" }) {
  for (let i = 0; i < n; i++) {
    const ph = fract(rnd(i + seed) + t * speed);
    if (!gate(t - ph / speed)) continue;
    const [a, b] = lane(i + seed);
    const p = lerp(x0, x1, ph);
    list.push(axis === "x" ? [p, a, b] : [a, b, p]);
  }
}

function camOrbit(t, dur, { r = 20, h = 8.5, a0 = 0.2, amp = 0.1, look = [0, 0.6, 0] } = {}) {
  const a = Math.sin((t / dur) * Math.PI * 2) * amp + a0;
  camera.position.set(Math.sin(a) * r + look[0], h, Math.cos(a) * r + look[2]);
  camera.lookAt(look[0], look[1], look[2]);
}

// ---------- 2D HUD ----------
function text(s, x, y, o = {}) {
  const c = hctx; c.save();
  c.font = `${o.w || 600} ${o.size || 16}px ${o.mono ? MONO : FONT}`;
  c.textAlign = o.a || "left"; c.globalAlpha = o.alpha ?? 1;
  if (o.glow) { c.shadowColor = o.glow; c.shadowBlur = 10; }
  c.fillStyle = o.c || C.text; c.fillText(s, x, y); c.restore();
}
function chip(s, x, y, color, o = {}) {
  const c = hctx; c.save();
  c.font = `700 ${o.size || 14}px ${o.mono ? MONO : FONT}`;
  const w = c.measureText(s).width + 22, h = (o.size || 14) + 14;
  const bx = o.a === "center" ? x - w / 2 : o.a === "right" ? x - w : x;
  c.globalAlpha = o.alpha ?? 1;
  c.fillStyle = "rgba(5,7,13,.84)"; c.fillRect(bx, y - h / 2, w, h);
  c.strokeStyle = color; c.lineWidth = 1.5; c.shadowColor = color; c.shadowBlur = 8;
  c.strokeRect(bx + .5, y - h / 2 + .5, w - 1, h - 1);
  c.shadowBlur = 0; c.fillStyle = color; c.textBaseline = "middle"; c.fillText(s, bx + 11, y + 1);
  c.restore();
  return { x: bx, y: y - h / 2, w, h };
}
function frame(title, tag) {
  const c = hctx; c.save(); c.strokeStyle = C.cyan; c.lineWidth = 2; c.globalAlpha = .8;
  const L = 18;
  [[12, 12, 1, 1], [W - 12, 12, -1, 1], [12, H - 12, 1, -1], [W - 12, H - 12, -1, -1]].forEach(([x, y, sx, sy]) => {
    c.beginPath(); c.moveTo(x, y + sy * L); c.lineTo(x, y); c.lineTo(x + sx * L, y); c.stroke();
  });
  c.restore();
  text(tag, 28, 40, { size: 12, mono: true, c: C.cyan, w: 500 });
  text(title, 28, 64, { size: 22, w: 700 });
}
const proj = (x, y, z) => { const v = new THREE.Vector3(x, y, z).project(camera); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };
// 3D 點拉一條引線到標籤
function callout(p3, x, y, s, color, o = {}) {
  const a = o.alpha ?? 1;
  if (a <= 0.01) return;
  const p = proj(...p3);
  const box = chip(s, x, y, color, { ...o, alpha: a });
  const tx = clamp(p[0], box.x, box.x + box.w), ty = p[1] < box.y ? box.y : box.y + box.h;
  const c = hctx; c.save(); c.globalAlpha = a; c.strokeStyle = color; c.fillStyle = color; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(tx, ty); c.stroke();
  c.beginPath(); c.arc(p[0], p[1], 3, 0, Math.PI * 2); c.fill(); c.restore();
}
function meter(x, y, label, value, color, valueText = "") {
  text(label, x, y, { size: 12, c: C.dim, w: 500 });
  if (valueText) text(valueText, x + 150, y, { size: 12, c: color, w: 700, a: "right", mono: true });
  const c = hctx; c.save();
  c.strokeStyle = "rgba(232,246,255,.35)"; c.strokeRect(x + .5, y + 6.5, 150, 10);
  c.fillStyle = color; c.shadowColor = color; c.shadowBlur = 8; c.fillRect(x + 2, y + 8, 146 * clamp(value), 7);
  c.restore();
}
function bitBox(on) {
  const col = on ? C.lime : C.red, c = hctx;
  c.save(); c.strokeStyle = col; c.lineWidth = 2; c.shadowColor = col; c.shadowBlur = 14; c.strokeRect(650, 28, 120, 66); c.restore();
  text(on ? "1" : "0", 690, 80, { size: 50, mono: true, c: col, glow: col, a: "center", w: 700 });
  text(on ? "ON" : "OFF", 742, 68, { size: 15, mono: true, c: col, a: "center" });
}

const SCENES = {};
function addScene(name, def) {
  const group = new THREE.Group();
  group.visible = false;
  scene.add(group);
  def.setup(group);
  SCENES[name] = { ...def, group };
}

const COL = { e: 0xfff27a, ion: 0xff4d5e, rad: 0x6dff6a, s: 0xd8dde6, f: 0x8fd3ff, photon: 0xc77dff };
// 離子雨：垂直落下（拖尾）+ 撞擊閃光
function ionRain(list, trail, flash, { t, n, seed, x0, x1, z0, z1, top, bottom, speed = 0.9 }) {
  for (let i = 0; i < n; i++) {
    const ph = fract(rnd(i + seed) + t * speed * (0.8 + 0.4 * rnd(i + seed + 1)));
    const x = lerp(x0, x1, rnd(i + seed + 2)), z = lerp(z0, z1, rnd(i + seed + 3)), yb = typeof bottom === "function" ? bottom(x) : bottom;
    const y = lerp(top, yb, ph * ph);
    list.push([x, y, z]);
    for (let j = 1; j <= 3; j++) { const pp = Math.max(0, ph - j * 0.05); trail.push([x, lerp(top, yb, pp * pp), z, 1 - j / 4]); }
    if (ph > 0.94) flash.push([x, yb, z, 1.1]);
  }
}
// 隨機亂飄的粒子（自由基等）
function drift(list, { t, n, seed, x0, x1, y0, y1, z0, z1, sp = 0.08, ok = null }) {
  for (let i = 0; i < n; i++) {
    const p = [lerp(x0, x1, 0.5 + 0.5 * tri(rnd(i + seed) + t * sp * (0.5 + rnd(i + seed + 1)))), lerp(y0, y1, 0.5 + 0.5 * tri(rnd(i + seed + 2) + t * sp * 1.3 * (0.5 + rnd(i + seed + 3)))), lerp(z0, z1, 0.5 + 0.5 * tri(rnd(i + seed + 4) + t * sp * 0.9))];
    if (!ok || ok(p)) list.push(p);
  }
}
// 產物 SiF₄：從表面往上飄走
// ---------- 本課共用：左下流程圖 ----------
function flowChain(items, y = 372) {
  let x = 40;
  items.forEach(([s, c], i) => { const b = chip(s, x, y, c, { size: 13 }); x = b.x + b.w + 6; if (i < items.length - 1) { text("→", x + 4, y + 5, { size: 15, c: C.dim, w: 700 }); x += 22; } });
}
// ---------- 本課共用：圓柱腔體 ----------
function cyl(parent, r, y0, y1, [face, edge], { opacity = 1, emissive = 0, ei = 0, seg = 48, open = false } = {}) {
  const g = new THREE.CylinderGeometry(r, r, y1 - y0, seg, 1, open);
  const mat = new THREE.MeshStandardMaterial({ color: face, transparent: opacity < 1, opacity, roughness: 0.45, metalness: 0.1, emissive, emissiveIntensity: ei, depthWrite: opacity >= 1, side: open ? THREE.DoubleSide : THREE.FrontSide });
  const m = new THREE.Mesh(g, mat);
  m.position.y = (y0 + y1) / 2;
  parent.add(m);
  const lines = new THREE.LineSegments(new THREE.EdgesGeometry(g, 30), new THREE.LineBasicMaterial({ color: edge, transparent: true, opacity: 0.8 }));
  m.add(lines);
  return { mesh: m, mat, lines };
}
const ring = (parent, r, y, color, tube = 0.04) => {
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 8, 96), new THREE.MeshBasicMaterial({ color, transparent: true }));
  m.rotation.x = Math.PI / 2; m.position.y = y; parent.add(m); return m;
};

// =====================================================================
// 本課共用：右側面板、線段、圓點；3D 放在左半邊
// =====================================================================
const TAG = "ETCH CHARACTERISTICS";
const PX = 452, PW = 334;
function panel(x, y, w, h, title, color = C.cyan) {
  const c = hctx; c.save();
  c.fillStyle = "rgba(4,8,16,.9)"; c.fillRect(x, y, w, h);
  c.strokeStyle = color; c.globalAlpha = 0.55; c.lineWidth = 1; c.strokeRect(x + .5, y + .5, w - 1, h - 1); c.restore();
  text(title, x + 10, y + 18, { size: 13, c: color, w: 700 });
}
function line(pts, color, { w = 2, dash = null, alpha = 1, glow = 6 } = {}) {
  if (pts.length < 2) return;
  const c = hctx; c.save(); c.globalAlpha = alpha; c.strokeStyle = color; c.lineWidth = w; c.shadowColor = color; c.shadowBlur = glow;
  if (dash) c.setLineDash(dash);
  c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.stroke(); c.restore();
}
function dot(x, y, color, r = 4, alpha = 1) {
  const c = hctx; c.save(); c.globalAlpha = alpha; c.fillStyle = color; c.shadowColor = color; c.shadowBlur = 10; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); c.restore();
}
function camLeft(t, dur, o) { camOrbit(t, dur, o); camera.setViewOffset(W, H, W * 0.235, -H * 0.02, W, H); }
// 步驟說明條（左上，標題下方）
function caption(lines, y = 96) {
  const c = hctx; c.save(); c.fillStyle = "rgba(4,8,16,.82)"; c.fillRect(24, y - 14, 410, lines.length * 18 + 10); c.restore();
  lines.forEach((s, i) => text(s, 32, y + 2 + i * 18, { size: i ? 12.5 : 14, c: i ? C.text : C.yellow, w: i ? 500 : 700 }));
}

// =====================================================================
// First wafer effect：腔壁從乾淨到被塗層覆蓋，前幾片的蝕刻率偏離
// =====================================================================
addScene("first-wafer", {
  dur: 12, fps: 15,
  setup(g) {
    this.wall = cyl(g, 3.2, 0, 5, [0x3a4658, 0x8fa8d0], { opacity: 0.16, open: true, emissive: 0x1a2433, ei: 0.4 });
    this.coat = cyl(g, 3.12, 0.15, 4.85, [0x8a5a2a, 0xffb36b], { opacity: 0.5, open: true, emissive: 0x6a3a10, ei: 0.5 });
    this.coat.lines.visible = false;
    cyl(g, 3.3, 5, 5.3, [0x6c7480, 0xc8ced8], { opacity: 0.3 });
    cyl(g, 2.7, -0.8, 0, [0x0f1a2c, 0x2c4a6e]);
    this.wafer = cyl(g, 2.3, 0, 0.12, M.si, { emissive: 0x0a3a66, ei: 0.5 });
    this.plasma = cyl(g, 2.9, 0.5, 4.6, [0x5a1a8a, 0xc77dff], { opacity: 0.1, emissive: 0x9a3ce0, ei: 0.7 });
    this.plasma.lines.visible = false;
    this.rad = particles(g, 90, COL.rad, 0.08);
    this.loss = particles(g, 40, 0xffffff, 0.12);
  },
  render(t) {
    camLeft(t, this.dur, { r: 23, h: 10.5, a0: 0.35, amp: 0.05, look: [0, 3.0, 0] });
    // 只比較兩個狀態：Wafer #1（腔壁乾淨）↔ Wafer #6（穩態），來回切換
    const k = seg(t, 5.4, 6.0) - seg(t, 11.4, 12.0), B = k > 0.5, coat = lerp(0.03, 0.9, k);
    this.coat.mat.opacity = 0.03 + 0.55 * coat;
    this.wall.mat.emissiveIntensity = 0.3 + 0.6 * k;
    this.plasma.mat.opacity = 0.11; this.plasma.mat.emissiveIntensity = 0.8;
    this.wafer.mat.emissiveIntensity = 0.5;
    const rad = [];
    drift(rad, { t, n: 110, seed: 3, x0: -2.9, x1: 2.9, y0: 0.3, y1: 4.6, z0: -2.9, z1: 2.9, sp: 0.1, ok: ([x, , z]) => x * x + z * z < 2.9 ** 2 });
    place(this.rad, rad);
    // 腔壁乾淨時：自由基撞壁就被吃掉（白色閃光）；有塗層後就少了
    const loss = [], nl = Math.round(40 * (1 - coat));
    for (let i = 0; i < nl; i++) { const th = rnd(i + Math.floor(t * 8) * 13) * Math.PI * 2, y = 0.4 + rnd(i * 3 + Math.floor(t * 8)) * 4.2; loss.push([Math.cos(th) * 3.05, y, Math.sin(th) * 3.05, 0.6 + 0.6 * rnd(i + t)]); }
    place(this.loss, loss);
    composer.render();
    hctx.clearRect(0, 0, W, H);
    frame("First wafer effect：前幾片為什麼跑不準", TAG);
    chip(B ? "Wafer #6（穩態）" : "Wafer #1", 772, 40, B ? C.cyan : C.yellow, { a: "right", size: 13 });
    caption(B ? ["Wafer #6：腔壁已有一層塗層（穩態）", "被腔壁吃掉的自由基變少 → ER 回到穩定值"] : ["Wafer #1：腔壁乾淨（閒置 / PM 後）", "自由基撞壁被吃掉（白光）→ 到晶圓的變少 → ER 偏低"]);
    callout([-3.1, 3.4, 0.8], 40, 336, "白光 = 自由基撞到乾淨腔壁被吃掉", C.grey);
    // 右邊：所有 wafer 的趨勢先用淺色畫好，目前這片用實點標出
    const N = 12, py = 80, ph1 = 330;
    panel(PX, py, PW, ph1, "蝕刻率 vs. 片號（相對穩定值）", C.cyan);
    const x0 = PX + 46, x1 = PX + PW - 16, y0 = py + ph1 - 28, y1 = py + 34;
    const X = (n) => lerp(x0, x1, (n - 1) / (N - 1)), Y = (v) => lerp(y0, y1, (v - 88) / 14);
    const c = hctx; c.save(); c.fillStyle = "rgba(93,255,176,.08)"; c.fillRect(x0, Y(101), x1 - x0, Y(99) - Y(101)); c.restore();
    line([[x0, Y(100)], [x1, Y(100)]], C.green, { w: 1, dash: [4, 3], glow: 0 });
    text("穩定值", x1, Y(100) - 5, { size: 10, c: C.green, w: 700, a: "right" });
    line([[x0, y1], [x0, y0], [x1, y0]], "rgba(232,246,255,.4)", { w: 1, glow: 0 });
    [90, 95, 100].forEach((v) => text(`${v}%`, x0 - 5, Y(v) + 4, { size: 10, c: C.dim, mono: true, w: 500, a: "right" }));
    [1, 4, 6, 8, 12].forEach((n) => text(`#${n}`, X(n), y0 + 15, { size: 10, c: C.dim, mono: true, w: 500, a: "center" }));
    const er = (n) => 100 - 9 * Math.exp(-(n - 1) / 1.6), pts = [];
    for (let n = 1; n <= N; n++) pts.push([X(n), Y(er(n))]);
    line(pts, "rgba(34,229,255,.35)", { w: 2, glow: 0 });
    pts.forEach(([x, y]) => dot(x, y, "rgba(34,229,255,.4)", 3.5));

// Pulsing：左邊連續 RF（沒有 pulsing）、右邊 pulsing，比較差在哪裡

// =====================================================================
addScene("pulsing", {
  dur: 15, fps: 15,
  setup(g) {
    this.a = 0.55; this.d = 2.4; this.hn = 0.42;
    const si = () => mbox(g, M.si, { emissive: 0x0a3a66, ei: 0.4, edges: false }); // 方塊互相貼合，不畫邊線以免共面閃爍
    this.S = [[-4.2, false], [4.2, true]].map(([c, pulse]) => {
      mbox(g, M.oxide, { emissive: 0x1a2a44, ei: 0.5 }).set(c - 2.6, -2.8, -1.2, c + 2.6, -2.41, 1.2);
      [[c - 2.6, c - this.a], [c + this.a, c + 2.6]].forEach(([x0, x1]) => mbox(g, M.mask, { opacity: 0.9 }).set(x0, 0, -1.2, x1, 0.35, 1.2));
      const sheath = mbox(g, [0x0a3a4a, 0x22e5ff], { opacity: 0.22, emissive: 0x22e5ff, ei: 0.3 });
      const plasma = mbox(g, [0x5a1a8a, 0xc77dff], { opacity: 0.12, emissive: 0x9a3ce0, ei: 0.8 }); plasma.lines.visible = false;
      return { c, pulse, Lu: si(), Ll: si(), Ru: si(), Rl: si(), B: si(), sheath, plasma, ions: particles(g, 24, COL.ion, 0.08), trail: particles(g, 72, COL.ion, 0.05), bent: particles(g, 6, 0xffa04d, 0.1), el: particles(g, 20, COL.e, 0.07), prod: particles(g, 30, 0xd8dde6, 0.08), plus: particles(g, 14, 0xff4d5e, 0.1), minus: particles(g, 10, 0x4fb0ff, 0.08), dmg: particles(g, 12, 0xc77dff, 0.09) };
    });
  },
  render(t) {
    this.group.position.y = 0.9; // 整組抬高，避免背景格線穿過結構
    camOrbit(t, this.dur, { r: 16, h: 4.5, a0: 0.1, amp: 0.03, look: [0, 0.3, 0] });
    camera.setViewOffset(W, H, 0, H * 0.02, W, H);
    const T = 2, Ton = 1.2, a = this.a, d = this.d, hn = this.hn, t0 = 0.5, MAIN = 4.5, OE = 2.0;
    const reset = seg(t, 14.4, 14.9), tt = Math.max(0, t - t0), tau = tt % T;
    const onTime = (pulse) => (pulse ? Math.floor(tt / T) * Ton + Math.min(tau, Ton) : tt);
    const vals = [];
    this.S.forEach((s) => {
      const ot = Math.min(onTime(s.pulse), MAIN + OE) * (1 - reset), done = ot >= MAIN + OE - 1e-6;
      const depth = d * clamp(ot / MAIN), over = clamp((ot - MAIN) / OE);
      const on = t >= t0 && !done && reset < 0.01 && (!s.pulse || tau < Ton);
      const tl = s.pulse ? tau : 0, sh = !on ? 0 : s.pulse ? 1 - Math.exp(-tl / 0.06) : 1;
      const te = on ? 1 : s.pulse && !done && t >= t0 ? 0.15 + 0.85 * Math.exp(-(tau - Ton) / 0.1) : 0.1;
      const q = s.pulse ? (on ? (1 - 0.95 * Math.exp(-tau / 0.5)) * 0.45 : !done && t >= t0 ? 0.45 * (1 - 0.95 * Math.exp(-Ton / 0.5)) * Math.exp(-(tau - Ton) / 0.18) : 0) * clamp(depth / 0.8) : clamp(ot / 2.5) * (1 - reset);
      const notch = (s.pulse ? 0.05 : 0.6) * over, c = s.c;
      // 矽：溝槽兩側各一塊（下段往內退 = notch），溝底還沒蝕穿的部分一塊
      const yb = -2.4, split = notch > 0.005;
      s.Lu.set(c - 2.6, split ? yb + hn : yb, -1.2, c - a, 0, 1.2); s.Ru.set(c + a, split ? yb + hn : yb, -1.2, c + 2.6, 0, 1.2);
      if (split) { s.Ll.set(c - 2.6, yb, -1.2, c - a - notch, yb + hn, 1.2); s.Rl.set(c + a + notch, yb, -1.2, c + 2.6, yb + hn, 1.2); } else { s.Ll.hide(); s.Rl.hide(); }
      if (depth < d - 0.005) s.B.set(c - a, yb, -1.2, c + a, -depth, 1.2); else s.B.hide();
      s.sheath.set(c - 2.6, 0.35, -1.2, c + 2.6, 0.35 + 0.6 * Math.max(sh, 0.02), 1.2).alpha(Math.max(0.02, sh));
      s.plasma.set(c - 2.6, 1.0, -1.2, c + 2.6, 1.8, 1.2); s.plasma.mat.opacity = 0.02 + 0.12 * te; s.plasma.mat.emissiveIntensity = 0.1 + 0.9 * te;
      const ions = [], tr = [], ok = ([x, y]) => y > 0.4 || Math.abs(x - c) < a - 0.06;
      if (on) ionRain(ions, tr, [], { t, n: 24, seed: 5 + c, x0: c - 1.2, x1: c + 1.2, z0: -1, z1: 1, top: 1.8, bottom: -depth, speed: 0.9 });
      place(s.ions, ions.filter(ok)); place(s.trail, tr.filter(ok));
      // 溝底正電荷把離子推向側壁 → notching
      const bent = [];
      if (on && q > 0.3 && over > 0) for (let i = 0; i < 3; i++) { const ph = fract(i / 3 + t * 0.7), [x, y] = along([[c + 0.05, 0.2], [c, yb + 0.6], [c - a - notch * 0.8, yb + 0.15]], ph); bent.push([x, y, (rnd(i) - 0.5) * 1.4, q]); }
      place(s.bent, bent);
      const pl = [], mi = [];
      for (let i = 0; i < Math.round(14 * q); i++) pl.push([c + (rnd(i + c) - 0.5) * 2 * (a - 0.08), -depth + 0.08, (rnd(i + c + 3) - 0.5) * 1.8]);
      for (let i = 0; i < Math.round(10 * q); i++) mi.push([c + (i % 2 ? 1 : -1) * (a - 0.04), -0.15 - Math.floor(i / 2) * 0.2, (rnd(i + c * 5) - 0.5) * 1.8]);
      place(s.plus, pl); place(s.minus, mi);
      // OFF：電子進到溝底中和電荷
      const off = s.pulse && !on && !done && t >= t0 && reset < 0.01, el = [];
      if (off) for (let i = 0; i < 18; i++) { const ph = fract(rnd(i + 40) + (tau - Ton) * 1.4); el.push([c + (rnd(i + 41) - 0.5) * 2 * (a - 0.1), lerp(1.4, -depth + 0.1, ph), (rnd(i + 42) - 0.5) * 1.6]); }
      place(s.el, el);
      // 溝內產物：連續 RF 時塞在溝裡；pulsing 在 OFF 時被排出
      const pr = [], np = done ? 0 : s.pulse ? (on ? Math.round(10 * tau / Ton) : Math.round(10 * Math.exp(-(tau - Ton) / 0.25))) : Math.round(26 * clamp(depth / d));
      for (let i = 0; i < np; i++) { const ph = off ? fract(rnd(i + 70) + (tau - Ton) * 1.2) : 0.15 * Math.sin(t * 1.5 + i) + 0.2; pr.push([c + (rnd(i + 71) - 0.5) * 2 * (a - 0.1), lerp(-depth + 0.3 + rnd(i + 72) * depth * 0.7, 1.5, clamp(ph)), (rnd(i + 73) - 0.5) * 1.6]); }
      place(s.prod, depth > 0.3 ? pr : []);
      // 高 Te / UV 造成的損傷：在溝底閃
      const dm = [], nd = on && depth > 0.5 ? Math.round(s.pulse ? 4 : 12) : 0;
      for (let i = 0; i < nd; i++) dm.push([c + (rnd(i + Math.floor(t * 8) * 3 + c) - 0.5) * 2 * (a - 0.1), -depth + 0.05, (rnd(i * 7 + Math.floor(t * 8)) - 0.5) * 1.8, 0.7 + rnd(i + t)]);
      place(s.dmg, dm);
      Object.assign(s, { notch, depth, done, on, ot });
      vals.push({ q, notch: notch / 0.6, prod: np / 26, te: done ? 0 : s.pulse ? 0.5 : 1, er: s.pulse ? Ton / T : 1 });
    });
    composer.render();
    hctx.clearRect(0, 0, W, H);
    frame("Pulsing：有沒有脈衝，差在哪裡", TAG);
    const [L, R] = this.S;
    const cap = reset > 0.01 ? "重新開始" : !L.done && L.depth < d ? "同樣的 recipe 往下蝕刻：右邊 RF 開 / 關，OFF 時沒有離子 → 不蝕刻，所以比較慢"
      : !L.done ? "左邊先蝕到停止層、開始 over-etch：溝底的正電荷把離子推向側壁 → 挖出 notch"
      : !R.done ? "左邊完成；右邊蝕到停止層後，也做同樣多的 over-etch（OFF 時電荷被中和）"
      : "結果：左邊溝底有 notch，右邊幾乎沒有；代價是右邊花了約 1.7 倍時間（duty 60%）";
    const c2 = hctx; c2.save(); c2.fillStyle = "rgba(4,8,16,.82)"; c2.fillRect(24, 82, W - 48, 26); c2.restore();
    text(cap, W / 2, 100, { size: 13, c: C.yellow, w: 700, a: "center" });
    this.S.forEach((s) => { if (s.notch > 0.0005 && (s.pulse ? R.done : true) && (L.done || !s.pulse)) callout([s.c - a - s.notch * 0.5, -2.4 + 0.2 + 0.9, 1.2], s.c < 0 ? 300 : 700, 318, s.pulse ? "幾乎沒有 notch" : "Notch：溝底側向被挖", s.pulse ? C.lime : C.orange, { a: "center" }); });
    line([[W / 2, 116], [W / 2, 436]], "rgba(232,246,255,.35)", { w: 1.5, dash: [6, 5], glow: 0 });
    chip("沒有 pulsing（RF 連續開）", W / 4, 136, C.red, { a: "center", size: 15 });
    chip("有 pulsing（RF 開 / 關）", (3 * W) / 4 - 30, 136, C.lime, { a: "center", size: 15 });
    const rs = R.done ? ["完成", C.grey] : t < t0 ? ["待機", C.grey] : R.on ? ["ON：蝕刻", C.magenta] : ["OFF：不蝕刻", C.blue];
    chip(rs[0], (3 * W) / 4 + 128, 136, rs[1], { a: "center", size: 12 });
    if (L.done) chip("完成", W / 4 + 132, 136, C.grey, { a: "center", size: 12 });

      meter(x0, 382, "溝內產物", v.prod, C.grey); meter(x0 + 175, 382, "電子溫度 Te（損傷）", v.te, C.magenta);
      meter(x0, 414, "平均蝕刻率", v.er, C.cyan, `${Math.round(v.er * 100)}%`);
      text("累積 ON 時間", x0 + 175, 414, { size: 12, c: C.dim, w: 500 });
      text(`${s.ot.toFixed(1)} s`, x0 + 325, 430, { size: 14, c: C.text, w: 700, mono: true, a: "right" });
    });
  },

    ][st]);
    this.C.forEach((c) => { const p = proj(c.x, c.top + 0.25, c.z); chip(c.n, p[0], p[1] - 6, c.er > 0.5 ? C.blue : C.grey, { a: "center", size: 10 }); });
    callout([-3.0, 2.05, 0.4], 40, 158, "腔壁 coupon：上面的沉積（橘）", C.amber);
    // 右上：量測結果
    const k = seg(t, 8.2, 9.2) * (1 - reset);
    panel(PX, 80, PW, 210, "量測結果（示意）", C.cyan);
    const rows = [["Center ER", 1.0, C.blue], ["Mid ER", 0.93, C.blue], ["Edge ER", 0.82, C.blue], ["Y₂O₃ 侵蝕", 0.05, C.grey], ["Quartz 侵蝕", 0.25, C.cyan], ["腔壁沉積（後 / 前）", 0.1, C.amber]];
    rows.forEach(([s, v, col], i) => {
      const yy = 116 + i * 28;
      text(s, PX + 14, yy + 4, { size: 12, c: col, w: 600 });
      hctx.save(); hctx.fillStyle = col; hctx.globalAlpha = 0.85; hctx.fillRect(PX + 150, yy - 6, 140 * v * k, 12); hctx.restore();
      if (k > 0.5) text(`${Math.round(v * 100)}%`, PX + PW - 12, yy + 4, { size: 11, c: col, w: 700, mono: true, a: "right", alpha: k });
    });
    text("ER 以 Center 為 100%；侵蝕以膜的 ER 為比較基準", PX + 14, 282, { size: 10.5, c: C.dim, w: 500 });
    // 右下：注意事項
    panel(PX, 300, PW, 136, "Coupon 結果要注意", C.amber);
    ["散熱：沒墊好導熱膏 → coupon 比晶圓熱", "高度差：邊緣電場變形 → 只量 coupon 中間", "載片 loading：用長 oxide 的載片較接近", "膠材 / 導熱膏：可能釋氣、污染腔體"].forEach((s, i) => text(`• ${s}`, PX + 14, 338 + i * 24, { size: 11.5, c: C.text, w: 500 }));
    chip("Coupon 適合看趨勢，最後仍要整片晶圓確認", 28, 410, C.lime, { size: 13 });
  },
});

// ---------- 匯出 ----------
for (const k of Object.keys(SCENES)) SCENES[k].fps = SCENES[k].fps || 15;
window.SCENES = SCENES;
window.renderAt = (name, t) => {
  for (const k of Object.keys(SCENES)) SCENES[k].group.visible = false;
  SCENES[name].group.visible = true;
  SCENES[name].render(t);
  octx.drawImage(glCanvas, 0, 0);
  octx.drawImage(hud, 0, 0);
  return out.toDataURL("image/png");
};
const name = location.hash.slice(1);
if (name && SCENES[name]) {
  const t0 = performance.now();
  (function loop() { renderAt(name, ((performance.now() - t0) / 1000) % SCENES[name].dur); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
