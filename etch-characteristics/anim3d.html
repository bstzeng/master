<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>Etch characteristics 3D GIF renderer</title>
<style>
  body { margin: 0; background: #05070d; }
  canvas { display: block; }
</style>
<script type="importmap">
  { "imports": { "three": "../nanosheet/vendor/three/three.module.min.js", "three/addons/": "../nanosheet/vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="out" width="800" height="450"></canvas>
<script type="module">
// 蝕刻製程特性與機台狀態課的 3D 場景：與 nanosheet/anim3d.html 共用同一套繪製核心與 three.js（../nanosheet/vendor）。
// 需要用 http 伺服器開啟（ES module 不能用 file://）。預覽：etch-characteristics/anim3d.html#first-wafer
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const W = 800, H = 450; // 版面座標（所有位置都用這個尺寸寫）
// 輸出倍率：?scale=2.4 → 1920×1080（1080P）；預設 1 → 800×450 預覽
const S = parseFloat(new URLSearchParams(location.search).get("scale") || "1");
const FONT = '"Noto Sans TC", "Noto Sans CJK TC", sans-serif';
const MONO = '"DejaVu Sans Mono", "DM Mono", monospace';
const C = { cyan: "#22e5ff", magenta: "#ff3df2", lime: "#b6ff3d", red: "#ff4d5e", amber: "#ffb340", orange: "#ffa04d", green: "#5dffb0", blue: "#5aa0ff", yellow: "#ffd23d", grey: "#c8ced8", text: "#e8f6ff", dim: "rgba(232,246,255,.62)" };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (k) => { k = clamp(k); return k * k * (3 - 2 * k); };
const seg = (v, a, b) => ease((v - a) / (b - a)); // v 在 a..b 之間的平滑進度
const fract = (v) => v - Math.floor(v);
const rnd = (i) => fract(Math.sin(i * 127.1 + 311.7) * 43758.5453);
const lerp = (a, b, k) => a + (b - a) * k;
const tri = (v) => 1 - 4 * Math.abs(fract(v) - 0.5); // -1..1 三角波（彈跳用）

// ---------- three.js ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(S);
renderer.setSize(W, H);
renderer.setClearColor(0x05070d, 1);
const glCanvas = renderer.domElement;
const hud = document.createElement("canvas");
hud.width = W * S; hud.height = H * S;
const hctx = hud.getContext("2d");
hctx.setTransform(S, 0, 0, S, 0, 0);
const out = document.getElementById("out");
out.width = W * S; out.height = H * S;
const octx = out.getContext("2d");

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x05070d, 24, 44);
const camera = new THREE.PerspectiveCamera(36, W / H, 0.1, 100);
scene.add(new THREE.AmbientLight(0x8fb4ff, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(6, 12, 8);
scene.add(key);
const rim = new THREE.DirectionalLight(0xff3df2, 0.6);
rim.position.set(-8, 4, -6);
scene.add(rim);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.9, 0.45, 0.55));
composer.addPass(new OutputPass());
composer.setPixelRatio(S);
const grid = new THREE.GridHelper(60, 60, 0x0e3a4a, 0x0a2230);
grid.position.y = -2.01;
scene.add(grid);

// 材料顏色（面, 邊）
const M = {
  sub: [0x0f1a2c, 0x2c4a6e], sti: [0x2a3a55, 0x4a6a95], si: [0x1d78c0, 0x4fc3ff], sige: [0xd9822b, 0xffa04d],
  poly: [0x7c828c, 0xc8ced8], spacer: [0x1f9e6a, 0x5dffb0], inner: [0x14c88a, 0x8dffd0], sd: [0x2a5fd0, 0x5aa0ff],
  hik: [0xffd23d, 0xffe680], gate: [0xb02cc0, 0xff3df2],
};

// 單位方塊：用 set(x0,y0,z0,x1,y1,z1) 改尺寸位置，任何一邊為 0 就隱藏
function mbox(parent, [face, edge], { opacity = 1, emissive = 0x000000, ei = 0, edges = true } = {}) {
  const g = new THREE.BoxGeometry(1, 1, 1);
  const mat = new THREE.MeshStandardMaterial({ color: face, transparent: opacity < 1, opacity, roughness: 0.45, metalness: 0.1, emissive, emissiveIntensity: ei, depthWrite: opacity >= 1 });
  const mesh = new THREE.Mesh(g, mat);
  parent.add(mesh);
  let lines = null;
  if (edges) { lines = new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({ color: edge, transparent: true, opacity: 0.95 })); mesh.add(lines); }
  const base = { opacity, line: 0.95 };
  const api = {
    mesh, mat, lines,
    set(x0, y0, z0, x1, y1, z1) {
      const sx = x1 - x0, sy = y1 - y0, sz = z1 - z0;
      if (sx < 1e-3 || sy < 1e-3 || sz < 1e-3) { mesh.visible = false; return api; }
      mesh.visible = true;
      mesh.scale.set(sx, sy, sz);
      mesh.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
      return api;
    },
    alpha(a) { // 0..1 淡入淡出
      mat.transparent = true; mat.opacity = base.opacity * a; mat.depthWrite = a >= 1 && base.opacity >= 1;
      if (lines) lines.material.opacity = base.line * a;
      if (a <= 0.001) mesh.visible = false;
      return api;
    },
    hide() { mesh.visible = false; return api; },
  };
  return api;
}

// 發光粒子（電子、自由基）
function particles(parent, count, color, r = 0.1) {
  const mesh = new THREE.InstancedMesh(new THREE.SphereGeometry(r, 10, 8), new THREE.MeshBasicMaterial({ color }), count);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  parent.add(mesh);
  return mesh;
}
const tmp = new THREE.Object3D();
function place(mesh, list) {
  const n = Math.min(list.length, mesh.count);
  for (let i = 0; i < n; i++) { const [x, y, z, s = 1] = list[i]; tmp.position.set(x, y, z); tmp.scale.setScalar(s); tmp.updateMatrix(); mesh.setMatrixAt(i, tmp.matrix); }
  tmp.scale.setScalar(0); tmp.updateMatrix();
  for (let i = n; i < mesh.count; i++) mesh.setMatrixAt(i, tmp.matrix);
  mesh.instanceMatrix.needsUpdate = true;
}

// 導通電子流：閘極開啟時才進入通道（關閉後已在通道內的電子跑完）
function stream(list, { n, seed, t, speed, x0, x1, lane, gate = () => true, axis = "x" }) {
  for (let i = 0; i < n; i++) {
    const ph = fract(rnd(i + seed) + t * speed);
    if (!gate(t - ph / speed)) continue;
    const [a, b] = lane(i + seed);
    const p = lerp(x0, x1, ph);
    list.push(axis === "x" ? [p, a, b] : [a, b, p]);
  }
}

function camOrbit(t, dur, { r = 20, h = 8.5, a0 = 0.2, amp = 0.1, look = [0, 0.6, 0] } = {}) {
  const a = Math.sin((t / dur) * Math.PI * 2) * amp + a0;
  camera.position.set(Math.sin(a) * r + look[0], h, Math.cos(a) * r + look[2]);
  camera.lookAt(look[0], look[1], look[2]);
}

// ---------- 2D HUD ----------
function text(s, x, y, o = {}) {
  const c = hctx; c.save();
  c.font = `${o.w || 600} ${o.size || 16}px ${o.mono ? MONO : FONT}`;
  c.textAlign = o.a || "left"; c.globalAlpha = o.alpha ?? 1;
  if (o.glow) { c.shadowColor = o.glow; c.shadowBlur = 10; }
  c.fillStyle = o.c || C.text; c.fillText(s, x, y); c.restore();
}
function chip(s, x, y, color, o = {}) {
  const c = hctx; c.save();
  c.font = `700 ${o.size || 14}px ${o.mono ? MONO : FONT}`;
  const w = c.measureText(s).width + 22, h = (o.size || 14) + 14;
  const bx = o.a === "center" ? x - w / 2 : o.a === "right" ? x - w : x;
  c.globalAlpha = o.alpha ?? 1;
  c.fillStyle = "rgba(5,7,13,.84)"; c.fillRect(bx, y - h / 2, w, h);
  c.strokeStyle = color; c.lineWidth = 1.5; c.shadowColor = color; c.shadowBlur = 8;
  c.strokeRect(bx + .5, y - h / 2 + .5, w - 1, h - 1);
  c.shadowBlur = 0; c.fillStyle = color; c.textBaseline = "middle"; c.fillText(s, bx + 11, y + 1);
  c.restore();
  return { x: bx, y: y - h / 2, w, h };
}
function frame(title, tag) {
  const c = hctx; c.save(); c.strokeStyle = C.cyan; c.lineWidth = 2; c.globalAlpha = .8;
  const L = 18;
  [[12, 12, 1, 1], [W - 12, 12, -1, 1], [12, H - 12, 1, -1], [W - 12, H - 12, -1, -1]].forEach(([x, y, sx, sy]) => {
    c.beginPath(); c.moveTo(x, y + sy * L); c.lineTo(x, y); c.lineTo(x + sx * L, y); c.stroke();
  });
  c.restore();
  text(tag, 28, 40, { size: 12, mono: true, c: C.cyan, w: 500 });
  text(title, 28, 64, { size: 22, w: 700 });
}
const proj = (x, y, z) => { const v = new THREE.Vector3(x, y, z).project(camera); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };
// 3D 點拉一條引線到標籤
function callout(p3, x, y, s, color, o = {}) {
  const a = o.alpha ?? 1;
  if (a <= 0.01) return;
  const p = proj(...p3);
  const box = chip(s, x, y, color, { ...o, alpha: a });
  const tx = clamp(p[0], box.x, box.x + box.w), ty = p[1] < box.y ? box.y : box.y + box.h;
  const c = hctx; c.save(); c.globalAlpha = a; c.strokeStyle = color; c.fillStyle = color; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(tx, ty); c.stroke();
  c.beginPath(); c.arc(p[0], p[1], 3, 0, Math.PI * 2); c.fill(); c.restore();
}
function meter(x, y, label, value, color, valueText = "") {
  text(label, x, y, { size: 12, c: C.dim, w: 500 });
  if (valueText) text(valueText, x + 150, y, { size: 12, c: color, w: 700, a: "right", mono: true });
  const c = hctx; c.save();
  c.strokeStyle = "rgba(232,246,255,.35)"; c.strokeRect(x + .5, y + 6.5, 150, 10);
  c.fillStyle = color; c.shadowColor = color; c.shadowBlur = 8; c.fillRect(x + 2, y + 8, 146 * clamp(value), 7);
  c.restore();
}
function bitBox(on) {
  const col = on ? C.lime : C.red, c = hctx;
  c.save(); c.strokeStyle = col; c.lineWidth = 2; c.shadowColor = col; c.shadowBlur = 14; c.strokeRect(650, 28, 120, 66); c.restore();
  text(on ? "1" : "0", 690, 80, { size: 50, mono: true, c: col, glow: col, a: "center", w: 700 });
  text(on ? "ON" : "OFF", 742, 68, { size: 15, mono: true, c: col, a: "center" });
}

const SCENES = {};
function addScene(name, def) {
  const group = new THREE.Group();
  group.visible = false;
  scene.add(group);
  def.setup(group);
  SCENES[name] = { ...def, group };
}

const COL = { e: 0xfff27a, ion: 0xff4d5e, rad: 0x6dff6a, s: 0xd8dde6, f: 0x8fd3ff, photon: 0xc77dff };
// 離子雨：垂直落下（拖尾）+ 撞擊閃光
function ionRain(list, trail, flash, { t, n, seed, x0, x1, z0, z1, top, bottom, speed = 0.9 }) {
  for (let i = 0; i < n; i++) {
    const ph = fract(rnd(i + seed) + t * speed * (0.8 + 0.4 * rnd(i + seed + 1)));
    const x = lerp(x0, x1, rnd(i + seed + 2)), z = lerp(z0, z1, rnd(i + seed + 3)), yb = typeof bottom === "function" ? bottom(x) : bottom;
    const y = lerp(top, yb, ph * ph);
    list.push([x, y, z]);
    for (let j = 1; j <= 3; j++) { const pp = Math.max(0, ph - j * 0.05); trail.push([x, lerp(top, yb, pp * pp), z, 1 - j / 4]); }
    if (ph > 0.94) flash.push([x, yb, z, 1.1]);
  }
}
// 隨機亂飄的粒子（自由基等）
function drift(list, { t, n, seed, x0, x1, y0, y1, z0, z1, sp = 0.08, ok = null }) {
  for (let i = 0; i < n; i++) {
    const p = [lerp(x0, x1, 0.5 + 0.5 * tri(rnd(i + seed) + t * sp * (0.5 + rnd(i + seed + 1)))), lerp(y0, y1, 0.5 + 0.5 * tri(rnd(i + seed + 2) + t * sp * 1.3 * (0.5 + rnd(i + seed + 3)))), lerp(z0, z1, 0.5 + 0.5 * tri(rnd(i + seed + 4) + t * sp * 0.9))];
    if (!ok || ok(p)) list.push(p);
  }
}
// 產物 SiF₄：從表面往上飄走
// ---------- 本課共用：左下流程圖 ----------
function flowChain(items, y = 372) {
  let x = 40;
  items.forEach(([s, c], i) => { const b = chip(s, x, y, c, { size: 13 }); x = b.x + b.w + 6; if (i < items.length - 1) { text("→", x + 4, y + 5, { size: 15, c: C.dim, w: 700 }); x += 22; } });
}
// ---------- 本課共用：圓柱腔體 ----------
function cyl(parent, r, y0, y1, [face, edge], { opacity = 1, emissive = 0, ei = 0, seg = 48, open = false } = {}) {
  const g = new THREE.CylinderGeometry(r, r, y1 - y0, seg, 1, open);
  const mat = new THREE.MeshStandardMaterial({ color: face, transparent: opacity < 1, opacity, roughness: 0.45, metalness: 0.1, emissive, emissiveIntensity: ei, depthWrite: opacity >= 1, side: open ? THREE.DoubleSide : THREE.FrontSide });
  const m = new THREE.Mesh(g, mat);
  m.position.y = (y0 + y1) / 2;
  parent.add(m);
  const lines = new THREE.LineSegments(new THREE.EdgesGeometry(g, 30), new THREE.LineBasicMaterial({ color: edge, transparent: true, opacity: 0.8 }));
  m.add(lines);
  return { mesh: m, mat, lines };
}
const ring = (parent, r, y, color, tube = 0.04) => {
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 8, 96), new THREE.MeshBasicMaterial({ color, transparent: true }));
  m.rotation.x = Math.PI / 2; m.position.y = y; parent.add(m); return m;
};

// =====================================================================
// 本課共用：右側面板、線段、圓點；3D 放在左半邊
// =====================================================================
const TAG = "ETCH CHARACTERISTICS";
const PX = 452, PW = 334;
function panel(x, y, w, h, title, color = C.cyan) {
  const c = hctx; c.save();
  c.fillStyle = "rgba(4,8,16,.9)"; c.fillRect(x, y, w, h);
  c.strokeStyle = color; c.globalAlpha = 0.55; c.lineWidth = 1; c.strokeRect(x + .5, y + .5, w - 1, h - 1); c.restore();
  text(title, x + 10, y + 18, { size: 13, c: color, w: 700 });
}
function line(pts, color, { w = 2, dash = null, alpha = 1, glow = 6 } = {}) {
  if (pts.length < 2) return;
  const c = hctx; c.save(); c.globalAlpha = alpha; c.strokeStyle = color; c.lineWidth = w; c.shadowColor = color; c.shadowBlur = glow;
  if (dash) c.setLineDash(dash);
  c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.stroke(); c.restore();
}
function dot(x, y, color, r = 4, alpha = 1) {
  const c = hctx; c.save(); c.globalAlpha = alpha; c.fillStyle = color; c.shadowColor = color; c.shadowBlur = 10; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); c.restore();
}
function camLeft(t, dur, o) { camOrbit(t, dur, o); camera.setViewOffset(W, H, W * 0.235, -H * 0.02, W, H); }
// 步驟說明條（左上，標題下方）
function caption(lines, y = 96) {
  const c = hctx; c.save(); c.fillStyle = "rgba(4,8,16,.82)"; c.fillRect(24, y - 14, 410, lines.length * 18 + 10); c.restore();
  lines.forEach((s, i) => text(s, 32, y + 2 + i * 18, { size: i ? 12.5 : 14, c: i ? C.text : C.yellow, w: i ? 500 : 700 }));
}

// =====================================================================
// First wafer effect：腔壁從乾淨到被塗層覆蓋，前幾片的蝕刻率偏離
// =====================================================================
addScene("first-wafer", {
  dur: 10, fps: 15,
  setup(g) {
    this.wall = cyl(g, 3.2, 0, 5, [0x3a4658, 0x8fa8d0], { opacity: 0.16, open: true, emissive: 0x1a2433, ei: 0.4 });
    this.coat = cyl(g, 3.12, 0.15, 4.85, [0x8a5a2a, 0xffb36b], { opacity: 0.5, open: true, emissive: 0x6a3a10, ei: 0.5 });
    this.coat.lines.visible = false;
    cyl(g, 3.3, 5, 5.3, [0x6c7480, 0xc8ced8], { opacity: 0.3 });
    cyl(g, 2.7, -0.8, 0, [0x0f1a2c, 0x2c4a6e]);
    this.wafer = cyl(g, 2.3, 0, 0.12, M.si, { emissive: 0x0a3a66, ei: 0.5 });
    this.plasma = cyl(g, 2.9, 0.5, 4.6, [0x5a1a8a, 0xc77dff], { opacity: 0.1, emissive: 0x9a3ce0, ei: 0.7 });
    this.plasma.lines.visible = false;
    this.rad = particles(g, 90, COL.rad, 0.08);
    this.loss = particles(g, 40, 0xffffff, 0.12);
  },
  render(t) {
    camLeft(t, this.dur, { r: 23, h: 10.5, a0: 0.35, amp: 0.05, look: [0, 3.0, 0] });
    const N = 12, t0 = 0.4, cyc = 0.76, tw = (t - t0) / cyc, n = clamp(Math.floor(tw) + 1, 1, N), ph = fract(tw);
    const run = t >= t0 && t < t0 + N * cyc, on = run && ph > 0.12 && ph < 0.92 ? 1 : 0;
    const reset = 1 - seg(t, 9.6, 9.95), nEff = clamp(tw, 0, N);
    const coat = (1 - Math.exp(-nEff / 2.2)) * reset, Tw = (1 - Math.exp(-nEff / 3)) * reset;
    this.coat.mat.opacity = 0.03 + 0.55 * coat;
    this.wall.mat.emissiveIntensity = 0.3 + 0.6 * Tw;
    this.plasma.mat.opacity = 0.11 * on; this.plasma.mat.emissiveIntensity = 0.8 * on;
    this.wafer.mat.emissiveIntensity = 0.4 + (run && ph < 0.12 ? 1.2 * (1 - ph / 0.12) : 0);
    // 自由基：在電漿裡亂飄
    const rad = [];
    if (on) drift(rad, { t, n: 110, seed: 3, x0: -2.9, x1: 2.9, y0: 0.3, y1: 4.6, z0: -2.9, z1: 2.9, sp: 0.1, ok: ([x, , z]) => x * x + z * z < 2.9 ** 2 });
    place(this.rad, rad);
    // 腔壁乾淨時：自由基撞壁就被吃掉（白色閃光）；塗層長好後就少了
    const loss = [], nl = Math.round(40 * (1 - coat) * on);
    for (let i = 0; i < nl; i++) { const th = rnd(i + Math.floor(t * 8) * 13) * Math.PI * 2, y = 0.4 + rnd(i * 3 + Math.floor(t * 8)) * 4.2; loss.push([Math.cos(th) * 3.05, y, Math.sin(th) * 3.05, 0.6 + 0.6 * rnd(i + t)]); }
    place(this.loss, loss);
    composer.render();
    hctx.clearRect(0, 0, W, H);
    frame("First wafer effect：前幾片為什麼跑不準", TAG);
    const idle = !run;
    chip(idle ? "閒置 / PM 後" : `Wafer #${n}`, 772, 40, idle ? C.grey : C.yellow, { a: "right", mono: !idle, size: 13 });
    if (idle) caption(["腔壁回到乾淨狀態", "閒置或 PM 後，腔壁上的塗層不見了"]);
    else if (n <= 3) caption([`第 ${n} 片：腔壁還很乾淨`, "自由基撞壁就被吃掉 → 到晶圓的變少", "壁溫也還沒穩定 → 蝕刻率偏低"]);
    else if (n <= 6) caption([`第 ${n} 片：腔壁慢慢長出一層塗層`, "壁面吃掉的自由基變少，壁溫往穩定值爬"]);
    else caption([`第 ${n} 片：腔壁狀態穩定`, "每片的蝕刻率一致 → 進入穩定生產"]);
    callout([-3.1, 3.4, 0.8], 40, 336, "白光 = 自由基撞到乾淨腔壁被吃掉（塗層長好後變少）", C.grey);
    // 右上：蝕刻率對片號
    const py = 80, ph1 = 226;
    panel(PX, py, PW, ph1, "蝕刻率 vs. 片號（相對穩定值）", C.cyan);
    const x0 = PX + 46, x1 = PX + PW - 16, y0 = py + ph1 - 28, y1 = py + 34;
    const X = (k) => lerp(x0, x1, (k - 1) / (N - 1)), Y = (v) => lerp(y0, y1, (v - 88) / 14);
    const c = hctx; c.save(); c.fillStyle = "rgba(93,255,176,.08)"; c.fillRect(x0, Y(101), x1 - x0, Y(99) - Y(101)); c.restore();
    line([[x0, Y(100)], [x1, Y(100)]], C.green, { w: 1, dash: [4, 3], glow: 0 });
    text("穩定值", x1, Y(100) - 5, { size: 10, c: C.green, w: 700, a: "right" });
    line([[x0, y1], [x0, y0], [x1, y0]], "rgba(232,246,255,.4)", { w: 1, glow: 0 });

addScene("flaking", {
  dur: 12, fps: 15,
  setup(g) { this.o = rig(g); this.flakes = particles(g, 40, 0xffb36b, 0.1); this.def = particles(g, 60, 0xff4d5e, 0.07); this.out = particles(g, 70, 0x6dff6a, 0.09); },
  render(t) {

    const o = this.o, A = t < 6, h = 1000 * clamp(t / 5.6);

    o.coat.mat.color.set(A ? 0x8a5a2a : 0x2f6a3a); o.coat.mat.emissive.set(A ? 0x6a3a10 : 0x1a5a20);
    rigPlasma(o, t, 1, A ? 0xc77dff : 0x7fb0ff, A ? 110 : 70);
    // A：剝落的碎片掉到晶圓上
    const pr = h > 600 ? (h - 600) / 400 : 0, fl = [], df = [];

      const nf = Math.round(40 * pr);
      for (let i = 0; i < nf; i++) { const ph = fract(rnd(i + 3) + t * 0.35), th = rnd(i + 4) * Math.PI * 2, r0 = 3.05, r1 = rnd(i + 5) * 2.1, y0 = 1.5 + rnd(i + 6) * 3; fl.push([Math.cos(th) * lerp(r0, r1, ph), lerp(y0, 0.15, ph * ph), Math.sin(th) * lerp(r0, r1, ph)]); }
      const nd = Math.round(60 * pr * pr);
      for (let i = 0; i < nd; i++) { const r = Math.sqrt(rnd(i + 50)) * 2.2, th = rnd(i + 51) * Math.PI * 2; df.push([Math.cos(th) * r, 0.14, Math.sin(th) * r]); }

    // B：上一個 recipe 的殘留從腔壁放出來

    if (!A) { const n = Math.round(70 * Math.exp(-tb * 2.5)); for (let i = 0; i < n; i++) { const ph = fract(rnd(i + 80) + t * 0.4), th = rnd(i + 81) * Math.PI * 2, y = 0.6 + rnd(i + 82) * 3.8; ou.push([Math.cos(th) * lerp(3.0, 1.2, ph), y + ph * 0.3, Math.sin(th) * lerp(3.0, 1.2, ph), 1 - ph * 0.5]); } }

    frame("剝落微粒與記憶效應", TAG);
    chip(A ? `RF ${Math.round(h)} h` : "換成 recipe B", 772, 40, A ? (h > 800 ? C.red : C.yellow) : C.blue, { a: "right", mono: A, size: 13 });
    caption(A ? (h < 600 ? ["微粒：腔壁沉積越來越厚", "沉積還附著得住，微粒數低"] : ["沉積太厚 → 應力累積、龜裂剝落", "碎片掉到晶圓上 → 微粒缺陷（紅點）"])
      : ["記憶效應：換 recipe 後，腔壁放出上一個 recipe 的殘留", "（綠點）混進新的電漿 → 前幾片的結果偏掉，之後才穩定"]);
    callout([-3.0, 3.4, 0.6], 40, 336, A ? "腔壁沉積（橘）：太厚會剝落" : "腔壁上 recipe A 的殘留（綠）", A ? C.amber : C.lime);
    const P1 = chart(80, 160, "微粒數 vs. RF 小時", C.red, { xa: 0, xb: 1000, ya: 0, yb: 100, xt: [[0, "0"], [500, "500"], [1000, "1000 h"]], yt: [[0, "0"], [50, "50"], [100, "100"]] });
    const pc = (v) => 4 + 90 * Math.max(0, (v - 600) / 400) ** 2;

// RF 傳輸、匹配與老化：設定功率 ≠ 送進電漿的功率

addScene("rf-match", {
  dur: 10, fps: 15,
  setup(g) {
    this.gen = mbox(g, [0x1a2233, 0x5aa0ff], { emissive: 0x1a3a99, ei: 0.4 }).set(-5.6, -0.2, -0.8, -3.8, 1.4, 0.8);
    this.mbx = mbox(g, [0x22283a, 0xffb340], { emissive: 0x3a2a10, ei: 0.4 }).set(-2.6, -0.2, -0.7, -1.0, 1.2, 0.7);
    this.knobs = [-2.2, -1.4].map((x) => { const k = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.2, 6), new THREE.MeshStandardMaterial({ color: 0xffb340, emissive: 0x6a4a10, emissiveIntensity: 0.6 })); k.position.set(x, 1.3, 0); g.add(k); return k; });
    this.ch = cyl(g, 2.2, 0, 3.6, [0x3a4658, 0x8fa8d0], { opacity: 0.16, open: true });
    cyl(g, 2.3, 3.6, 3.85, M.mask, { opacity: 0.3 });
    this.ch.mesh.position.x = 2.4;
    const chuck = cyl(g, 1.8, -0.6, 0, [0x0f1a2c, 0x2c4a6e]); chuck.mesh.position.x = 2.4;
    const wafer = cyl(g, 1.6, 0, 0.1, M.si, { emissive: 0x0a3a66, ei: 0.5 }); wafer.mesh.position.x = 2.4;
    this.plasma = cyl(g, 1.9, 0.4, 3.3, [0x5a1a8a, 0xc77dff], { opacity: 0.12, emissive: 0x9a3ce0, ei: 0.8 }); this.plasma.mesh.position.x = 2.4; this.plasma.lines.visible = false;
    this.conn = mbox(g, [0x6a6a6a, 0xffffff], { emissive: 0xff3a10, ei: 0 }).set(2.1, -1.3, -0.3, 2.7, -0.6, 0.3);
    this.path = new THREE.CatmullRomCurve3([[-3.8, 0.5, 0], [-2.6, 0.5, 0], [-1.0, 0.5, 0], [0.4, 0.5, 0], [1.2, -1.0, 0], [2.4, -1.0, 0], [2.4, -0.6, 0]].map((p) => new THREE.Vector3(...p)), false, "catmullrom", 0.1);
    this.cable = new THREE.Mesh(new THREE.TubeGeometry(this.path, 120, 0.1, 8, false), new THREE.MeshStandardMaterial({ color: 0x5a3a20, emissive: 0xff5a10, emissiveIntensity: 0 }));
    g.add(this.cable);
    this.fwd = particles(g, 40, 0xffd23d, 0.12); this.ref = particles(g, 30, 0xff4d5e, 0.12);
  },
  render(t) {
    camLeft(t, this.dur, { r: 18, h: 7.5, a0: 0.25, amp: 0.05, look: [-1.0, 1.7, 0] });
    const reset = seg(t, 9.3, 9.8), h = 2000 * clamp((t - 0.4) / 8.6) * (1 - reset), k = h / 2000;
    const loss = 2 + 6 * k ** 1.5, refl = 0.5 + 4 * k ** 2.2, del = 100 - loss - refl, er = 100 - 1.05 * (loss + refl - 2.5);
    this.cable.material.emissiveIntensity = 0.15 * k; this.conn.mat.emissiveIntensity = 1.4 * k ** 1.5;
    this.knobs.forEach((kb, i) => { kb.rotation.y = (i ? -1 : 1) * (k * 2.4 + 0.15 * Math.sin(t * 3)); });
    this.plasma.mat.opacity = 0.08 + 0.06 * del / 100; this.plasma.mat.emissiveIntensity = 0.5 + 0.5 * (del - 85) / 15;
    const fw = [], rf = [];
    for (let i = 0; i < 40; i++) fw.push([...this.path.getPointAt(fract(i / 40 + t * 0.12)).toArray(), 0.9]);
    const nr = Math.round(30 * clamp(refl / 4.5));
    for (let i = 0; i < nr; i++) rf.push([...this.path.getPointAt(1 - fract(i / 30 + t * 0.15)).toArray(), 0.8]);
    place(this.fwd, fw); place(this.ref, rf);
    composer.render();
    hctx.clearRect(0, 0, W, H);
    frame("RF 傳輸、匹配與老化：設定功率 ≠ 送進電漿的功率", TAG);
    chip(reset > 0.3 ? "PM：更換零件" : `RF ${Math.round(h)} h`, 772, 40, k > 0.7 ? C.red : C.yellow, { a: "right", mono: reset <= 0.3, size: 13 });
    caption(reset > 0.3 ? ["PM：更換電纜、接頭、耗材 → 回到起點", "換完零件常伴隨一次 shift，要重新確認 / matching"]
      : k < 0.2 ? ["新零件：匹配良好", "送進電漿的功率 ≈ 設定值"]

    text("← 監看的譜線", bx0 + 10 * bw + 2, 330, { size: 11, c: C.magenta, w: 700 });
    text("波長 →", PX + PW - 14, 398, { size: 10, c: C.dim, w: 500, a: "right" });
    bottomChips("為什麼要 over-etch：各處蝕穿時間不同", "開口率太低 → 訊號弱、endpoint 不好抓");
  },
});

// =====================================================================
// 輪廓缺陷：bowing、microtrenching、notching、footing
// =====================================================================
addScene("profile-defects", {
  dur: 12, fps: 15,
  setup(g) {
    this.B = [["bowing", -6.3], ["micro", -2.1], ["notch", 2.1], ["foot", 6.3]].map(([k, c]) => {
      mbox(g, M.oxide, { emissive: 0x1a2a44, ei: 0.5 }).set(c - 1.7, -0.4, -1, c + 1.7, 0, 1);
      const sol = profileSolid(g, M.si, { yBottom: 0, z0: -1, z1: 1 });
      [[c - 1.7, c - 0.42], [c + 0.42, c + 1.7]].forEach(([a, b]) => mbox(g, M.mask, { opacity: 0.9 }).set(a, 2.2, -1, b, 2.5, 1));
      const ideal = new THREE.Line(new THREE.BufferGeometry().setFromPoints([[c - 0.42, 2.2], [c - 0.42, 0], [c + 0.42, 0], [c + 0.42, 2.2]].map(([x, y]) => new THREE.Vector3(x, y, 1.02))), new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.12, gapSize: 0.1, transparent: true, opacity: 0.6 }));
      ideal.computeLineDistances(); g.add(ideal);
      return { k, c, sol };
    });
    this.ions = particles(g, 60, COL.ion, 0.07); this.spec = particles(g, 30, 0xffa04d, 0.09); this.poly = particles(g, 30, 0xffb36b, 0.08);
    this.plus = particles(g, 12, 0xff4d5e, 0.09); this.minus = particles(g, 16, 0x4fb0ff, 0.08);
  },
  render(t) {
    camOrbit(t, this.dur, { r: 21, h: 4.5, a0: 0, amp: 0.04, look: [0, 0.6, 0] });
    camera.clearViewOffset();
    const p = seg(t, 0.4, 7.5) * (1 - seg(t, 11.3, 11.9)), a = 0.42, top = 2.2, N = 12;
    const ions = [], sp = [], po = [], pl = [], mi = [], info = {};
    this.B.forEach(({ k, c, sol }) => {
      let d, bulge = () => 0, corner = 0, notch = 0, foot = 0;
      if (k === "bowing") { d = 2.0 * p; bulge = (s) => 0.3 * p * Math.sin(Math.PI * s) ** 1.5; }
      if (k === "micro") { d = 1.7 * p; bulge = (s) => -0.07 * s; corner = 0.3 * p; }
      if (k === "notch") { d = top * Math.min(1, p / 0.7); notch = seg(p, 0.7, 1); bulge = (s) => (s > 0.86 ? 0.32 * notch * ((s - 0.86) / 0.14) : 0); }
      if (k === "foot") { d = top * Math.min(1, p / 0.8); foot = seg(p, 0.4, 1); bulge = (s) => -0.3 * foot * clamp((s - 0.78) / 0.22) ** 1.3; }
      const L = [], R = [];
      for (let i = 0; i <= N; i++) { const s = i / N; L.push([c - a - bulge(s), top - s * d]); R.push([c + a + bulge(s), top - s * d]); }
      const bot = corner > 0 ? [[c - a + 0.07 + 0.04, top - d - corner], [c - a + 0.32, top - d], [c + a - 0.32, top - d], [c + a - 0.11, top - d - corner]] : [];
      sol.update(d < 0.01 ? [[c - 1.7, top], [c + 1.7, top]] : [[c - 1.7, top], ...L, ...bot, ...R.reverse(), [c + 1.7, top]]);
      info[k] = { c, d, bulge };
      // 一般離子：垂直往下
      for (let i = 0; i < 12; i++) { const ph = fract(rnd(i + c * 7) + t * 0.7), x = c + (rnd(i + c * 3) - 0.5) * 0.6; ions.push([x, lerp(3.5, top - d + 0.05, ph), 1.0 * (rnd(i + c) - 0.5)]); }
      // 說明機制的軌跡（橘色）
      const path = k === "bowing" ? [[c + 0.25, 3.5], [c - a - bulge(0.45), top - 0.45 * d]] : k === "micro" ? [[c - a + 0.14, 3.5], [c - a + 0.08, top - 0.4 * d], [c - a + 0.1, top - d - corner]] : k === "notch" ? [[c, 3.5], [c, top - d + 0.4], [c - a - 0.3 * notch, top - d + 0.08]] : null;
      if (path && d > 0.3) for (let i = 0; i < 6; i++) { const [x, y] = along(path.map(([x, y]) => [x + (k === "micro" && i % 2 ? 2 * c - 2 * x : 0), y]), fract(i / 6 + t * 0.5)); sp.push([x, y, 1.02]); }
      if (k === "foot" && d > 0.5) for (let i = 0; i < 12; i++) { const side = i % 2 ? 1 : -1, ph = fract(i / 12 + t * 0.4), [x, y] = along([[c + side * 0.1, 3.5], [c + side * (a - 0.1), top - d + 0.08]], ph); po.push([x, y, 1.02 * (rnd(i) - 0.5)]); }
      if (k === "notch" && notch > 0) { for (let i = 0; i < 6; i++) pl.push([c - 0.3 + i * 0.12, 0.08, 1.02 * (rnd(i) - 0.5) * 0.8, notch]); for (let i = 0; i < 8; i++) mi.push([c + (i % 2 ? 1 : -1) * (a + 0.03), top - 0.1 - Math.floor(i / 2) * 0.22, 1.02, notch]); }
    });
    place(this.ions, ions); place(this.spec, sp); place(this.poly, po); place(this.plus, pl); place(this.minus, mi);
    composer.render();
    hctx.clearRect(0, 0, W, H);
    frame("常見的輪廓缺陷", TAG);
    chip("白色虛線 = 理想的垂直輪廓", 772, 40, C.grey, { a: "right", size: 12 });
    const names = { bowing: ["Bowing 側壁中段被挖大", "離子散射打到側壁", "加強側壁保護"], micro: ["Microtrenching 溝底兩角較深", "離子被側壁反射到角落", "調側壁角度、離子能量"], notch: ["Notching 底部側向缺口", "電荷累積讓離子轉向", "脈衝電漿、少 over-etch"], foot: ["Footing 底部殘留", "底角聚合物多、蝕刻不足", "調聚合物、加 over-etch"] };
    this.B.forEach(({ k, c }) => {
      const [n, why, fix] = names[k], pt = proj(c, 3.9, 0), pb = proj(c, -0.4, 1);
      text(n.split(" ")[0], pt[0], pt[1] - 22, { size: 15, c: C.yellow, w: 700, a: "center" });
      text(n.split(" ")[1], pt[0], pt[1] - 4, { size: 12, c: C.text, w: 600, a: "center" });
      text(why, pb[0], pb[1] + 26, { size: 10.5, c: C.orange, w: 600, a: "center" });
      text(fix, pb[0], pb[1] + 44, { size: 10.5, c: C.lime, w: 600, a: "center" });
    });
    legend([["紅 = 離子", C.red], ["橘 = 造成缺陷的離子軌跡", C.orange], ["＋ / − = 累積的電荷", C.blue], ["橘字 = 原因、綠字 = 對策", C.lime]], 32, 348);
  },
});

// =====================================================================
// Pulsing：左邊連續 RF（沒有 pulsing）、右邊 pulsing，比較差在哪裡
// =====================================================================
addScene("pulsing", {
  dur: 12, fps: 15,
  setup(g) {
    this.a = 0.55; this.top = 0; this.d = 2.4;
    this.S = [[-4.2, false], [4.2, true]].map(([c, pulse]) => {
      mbox(g, M.oxide, { emissive: 0x1a2a44, ei: 0.5 }).set(c - 2.6, -2.8, -1.2, c + 2.6, -2.4, 1.2);
      const sol = profileSolid(g, M.si, { yBottom: -2.4, z0: -1.2, z1: 1.2 });
      [[c - 2.6, c - this.a], [c + this.a, c + 2.6]].forEach(([x0, x1]) => mbox(g, M.mask, { opacity: 0.9 }).set(x0, 0, -1.2, x1, 0.35, 1.2));
      const sheath = mbox(g, [0x0a3a4a, 0x22e5ff], { opacity: 0.22, emissive: 0x22e5ff, ei: 0.3 });
      const plasma = mbox(g, [0x5a1a8a, 0xc77dff], { opacity: 0.12, emissive: 0x9a3ce0, ei: 0.8 }); plasma.lines.visible = false;
      return { c, pulse, sol, sheath, plasma, ions: particles(g, 24, COL.ion, 0.08), trail: particles(g, 72, COL.ion, 0.05), bent: particles(g, 10, 0xffa04d, 0.1), el: particles(g, 20, COL.e, 0.07), prod: particles(g, 30, 0xd8dde6, 0.08), plus: particles(g, 14, 0xff4d5e, 0.1), minus: particles(g, 10, 0x4fb0ff, 0.08), dmg: particles(g, 12, 0xc77dff, 0.09) };
    });
  },
  render(t) {
    camOrbit(t, this.dur, { r: 16, h: 3.6, a0: 0.1, amp: 0.03, look: [0, -0.6, 0] });
    camera.setViewOffset(W, H, 0, H * 0.02, W, H);
    const T = 2, Ton = 1.2, a = this.a, d = this.d, reset = 1 - seg(t, 11.3, 11.9);
    const p = seg(t, 0.3, 6.5) * reset, depth = d * p, reach = seg(p, 0.85, 1) * seg(t, 6.5, 9.5) + (t >= 9.5 ? 1 : 0) * 0;
    const over = seg(t, 6.5, 10) * reset; // 蝕到停止層之後的 over-etch
    const tau = t % T, onR = tau < Ton;
    const qR = (() => { const u = tau; return u < Ton ? 1 - 0.95 * Math.exp(-u / 0.5) : (1 - 0.95 * Math.exp(-Ton / 0.5)) * Math.exp(-(u - Ton) / 0.18); })() * 0.45;
    const teR = onR ? 1 - 0.85 * Math.exp(-tau / 0.06) : 0.15 + 0.85 * Math.exp(-(tau - Ton) / 0.1);
    const qL = seg(t, 0.4, 3) * reset;
    const vals = [];
    this.S.forEach((s) => {
      const on = s.pulse ? onR : true, sh = s.pulse ? (onR ? 1 - Math.exp(-tau / 0.06) : Math.exp(-(tau - Ton) / 0.08)) : 1;
      const q = s.pulse ? qR * (p > 0.3 ? 1 : p / 0.3) : qL, te = s.pulse ? teR : 1;
      const notch = (s.pulse ? 0.06 : 0.7) * over;
      const c = s.c, L = [], R = [], N = 12;
      for (let i = 0; i <= N; i++) { const k = i / N, y = -k * depth, b = k > 0.86 ? notch * ((k - 0.86) / 0.14) : 0; L.push([c - a - b, y]); R.push([c + a + b * 0.35, y]); }
      s.sol.update(depth < 0.01 ? [[c - 2.6, 0], [c + 2.6, 0]] : [[c - 2.6, 0], ...L, ...R.reverse(), [c + 2.6, 0]]);
      s.sheath.set(c - 2.6, 0.35, -1.2, c + 2.6, 0.35 + 0.6 * sh, 1.2).alpha(Math.max(0.02, sh));
      s.plasma.set(c - 2.6, 1.0, -1.2, c + 2.6, 1.8, 1.2); s.plasma.mat.opacity = 0.03 + 0.11 * te; s.plasma.mat.emissiveIntensity = 0.2 + 0.8 * te;
      const ions = [], tr = [], ok = ([x, y]) => y > 0.4 || Math.abs(x - c) < a - 0.06;
      if (on) ionRain(ions, tr, [], { t, n: 24, seed: 5 + c, x0: c - 1.2, x1: c + 1.2, z0: -1, z1: 1, top: 1.8, bottom: -depth, speed: 0.9 });
      place(s.ions, ions.filter(ok)); place(s.trail, tr.filter(ok));
      // 溝底正電荷把離子推向側壁 → notching
      const bent = [];
      if (on && q > 0.3 && p > 0.85) for (let i = 0; i < 3; i++) { const ph = fract(i / 3 + t * 0.7), [x, y] = along([[c + 0.05, 0.2], [c, -depth + 0.45], [c - a - notch * 0.9, -depth + 0.1]], ph); bent.push([x, y, (rnd(i) - 0.5) * 1.4, q]); }
      place(s.bent, bent);
      const pl = [], mi = [];
      for (let i = 0; i < Math.round(14 * q); i++) pl.push([c + (rnd(i + c) - 0.5) * 2 * (a - 0.08), -depth + 0.08, (rnd(i + c + 3) - 0.5) * 1.8]);
      for (let i = 0; i < Math.round(10 * q); i++) mi.push([c + (i % 2 ? 1 : -1) * (a - 0.04), -0.15 - Math.floor(i / 2) * 0.2, (rnd(i + c * 5) - 0.5) * 1.8]);
      place(s.plus, pl); place(s.minus, mi);
      // OFF：電子進到溝底中和電荷
      const el = [];
      if (!on) for (let i = 0; i < 18; i++) { const ph = fract(rnd(i + 40) + (tau - Ton) * 1.4); el.push([c + (rnd(i + 41) - 0.5) * 2 * (a - 0.1), lerp(1.4, -depth + 0.1, ph), (rnd(i + 42) - 0.5) * 1.6]); }
      place(s.el, el);
      // 溝內產物：連續 RF 時塞在溝裡出不去；pulsing 在 OFF 時被排出
      const pr = [], np = s.pulse ? (onR ? Math.round(10 * tau / Ton) : Math.round(10 * Math.exp(-(tau - Ton) / 0.25))) : Math.round(26 * p);
      for (let i = 0; i < np; i++) { const ph = s.pulse && !onR ? fract(rnd(i + 70) + (tau - Ton) * 1.2) : 0.15 * Math.sin(t * 1.5 + i) + 0.2; pr.push([c + (rnd(i + 71) - 0.5) * 2 * (a - 0.1), lerp(-depth + 0.3 + rnd(i + 72) * depth * 0.7, 1.5, clamp(ph)), (rnd(i + 73) - 0.5) * 1.6]); }
      place(s.prod, depth > 0.3 ? pr : []);
      // 電漿損傷（高 Te / UV）：在溝底閃
      const dm = [], nd = Math.round(12 * Math.max(0, te - 0.3) * (s.pulse ? 0.3 : 1) * (depth > 0.5 ? 1 : 0));
      for (let i = 0; i < nd; i++) dm.push([c + (rnd(i + Math.floor(t * 8) * 3 + c) - 0.5) * 2 * (a - 0.1), -depth + 0.05, (rnd(i * 7 + Math.floor(t * 8)) - 0.5) * 1.8, 0.7 + rnd(i + t)]);
      place(s.dmg, dm);
      s.notch = notch; s.depth = depth;
      vals.push({ q: q / 1, notch: notch / 0.7, prod: np / 26, te: s.pulse ? 0.3 + 0.2 * teR : 1 });
    });
    composer.render();
    hctx.clearRect(0, 0, W, H);
    frame("Pulsing：有沒有脈衝，差在哪裡", TAG);
    const c2 = hctx; c2.save(); c2.fillStyle = "rgba(4,8,16,.82)"; c2.fillRect(24, 82, W - 48, 26); c2.restore();
    text(t < 6.5 ? "同樣的 recipe 往下蝕刻：左邊 RF 一直開著，右邊 RF 開 / 關交替" : "蝕到停止層、繼續 over-etch：左邊溝底側向被挖出 notch，右邊幾乎沒有", W / 2, 100, { size: 13, c: C.yellow, w: 700, a: "center" });
    this.S.forEach((s) => { if (over > 0.25) callout([s.c - a - s.notch * 0.6, -s.depth + 0.15, 1.2], s.c < 0 ? 300 : 700, 318, s.pulse ? "幾乎沒有 notch" : "Notch：溝底側向被挖", s.pulse ? C.lime : C.orange, { a: "center", alpha: seg(over, 0.25, 0.5) }); });
    line([[W / 2, 116], [W / 2, 436]], "rgba(232,246,255,.35)", { w: 1.5, dash: [6, 5], glow: 0 });
    chip("沒有 pulsing（RF 連續開）", W / 4, 136, C.red, { a: "center", size: 15 });
    chip("有 pulsing（RF 開 / 關）", (3 * W) / 4, 136, C.lime, { a: "center", size: 15 });
    chip(onR ? "ON" : "OFF", (3 * W) / 4 + 128, 136, onR ? C.magenta : C.blue, { a: "center", mono: true, size: 12 });
    // 下方比較：四個量表
    [["溝底正電荷（＋）", "q", C.red], ["Notching", "notch", C.orange], ["溝內產物", "prod", C.grey], ["電子溫度 Te（損傷）", "te", C.magenta]].forEach(([s, k, col], i) => {
      vals.forEach((v, j) => meter(40 + j * 400 + (i % 2) * 175, 366 + Math.floor(i / 2) * 36, s, v[k], col));
    });
    text(onR ? "ON：和左邊一樣在蝕刻" : "OFF：電子中和電荷、產物排出、Te 降下來", (3 * W) / 4, 436, { size: 12, c: onR ? C.dim : C.lime, w: 700, a: "center" });
    text("電荷一直累積、產物塞在溝裡、Te 一直很高", W / 4, 436, { size: 12, c: C.red, w: 700, a: "center" });
  },
});

// ---------- 匯出 ----------
for (const k of Object.keys(SCENES)) SCENES[k].fps = SCENES[k].fps || 15;
window.SCENES = SCENES;
window.renderAt = (name, t) => {
  for (const k of Object.keys(SCENES)) SCENES[k].group.visible = false;
  SCENES[name].group.visible = true;
  SCENES[name].render(t);
  octx.drawImage(glCanvas, 0, 0);
  octx.drawImage(hud, 0, 0);
  return out.toDataURL("image/png");
};
const name = location.hash.slice(1);
if (name && SCENES[name]) {
  const t0 = performance.now();
  (function loop() { renderAt(name, ((performance.now() - t0) / 1000) % SCENES[name].dur); requestAnimationFrame(loop); })();
}
</script>
