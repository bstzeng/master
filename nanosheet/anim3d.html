<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>Nanosheet 3D GIF renderer</title>
<style>
  body { margin: 0; background: #05070d; }
  canvas { display: block; }
  #gl, #hud { position: absolute; left: 0; top: 0; }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="out" width="800" height="450"></canvas>
<script type="module">
// 3D 場景：用 three.js 繪製，2D HUD 疊在上面，再合成到 #out 讓錄製程式擷取
// 需要用 http 伺服器開啟（ES module 不能用 file://），預覽：anim3d.html#02-gate-control-3d
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const W = 800, H = 450;
const FONT = '"Noto Sans TC", "Noto Sans CJK TC", sans-serif';
const MONO = '"DejaVu Sans Mono", "DM Mono", monospace';
const C = { cyan: "#22e5ff", magenta: "#ff3df2", lime: "#b6ff3d", red: "#ff4d5e", amber: "#ffb340", text: "#e8f6ff", dim: "rgba(232,246,255,.6)" };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (k) => { k = clamp(k); return k * k * (3 - 2 * k); };
const fract = (v) => v - Math.floor(v);
const rnd = (i) => fract(Math.sin(i * 127.1 + 311.7) * 43758.5453);
const lerp = (a, b, k) => a + (b - a) * k;

// ---------- three.js 基本設定 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x05070d, 1);
const glCanvas = renderer.domElement;
const hud = document.createElement("canvas");
hud.width = W; hud.height = H;
const hctx = hud.getContext("2d");
const out = document.getElementById("out");
const octx = out.getContext("2d");

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x05070d, 22, 40);
const camera = new THREE.PerspectiveCamera(36, W / H, 0.1, 100);
scene.add(new THREE.AmbientLight(0x8fb4ff, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(6, 12, 8);
scene.add(key);
const rim = new THREE.DirectionalLight(0xff3df2, 0.6);
rim.position.set(-8, 4, -6);
scene.add(rim);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.9, 0.45, 0.55);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// 地板網格
const grid = new THREE.GridHelper(60, 60, 0x0e3a4a, 0x0a2230);
grid.position.y = -2.01;
scene.add(grid);

// 方塊 + 發光邊線
function box(parent, [x0, y0, z0], [x1, y1, z1], color, { opacity = 1, edge = null, emissive = 0x000000, ei = 0 } = {}) {
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0);
  const m = new THREE.MeshStandardMaterial({ color, transparent: opacity < 1, opacity, roughness: 0.45, metalness: 0.1, emissive, emissiveIntensity: ei, depthWrite: opacity >= 1 });
  const mesh = new THREE.Mesh(g, m);
  mesh.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  parent.add(mesh);
  if (edge !== null) {
    const lines = new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({ color: edge, transparent: true, opacity: 0.95 }));
    mesh.add(lines);
    mesh.userData.lines = lines;
  }
  return mesh;
}

// 電子：InstancedMesh 發光小球
function particles(count, color, r = 0.085) {
  const mesh = new THREE.InstancedMesh(new THREE.SphereGeometry(r, 10, 8), new THREE.MeshBasicMaterial({ color }), count);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(mesh);
  return mesh;
}
const tmp = new THREE.Object3D();
function place(mesh, list) {
  list.forEach(([x, y, z, s], i) => { tmp.position.set(x, y, z); tmp.scale.setScalar(s); tmp.updateMatrix(); mesh.setMatrixAt(i, tmp.matrix); });
  for (let i = list.length; i < mesh.count; i++) { tmp.scale.setScalar(0); tmp.updateMatrix(); mesh.setMatrixAt(i, tmp.matrix); }
  mesh.instanceMatrix.needsUpdate = true;
}

// ---------- 2D HUD 工具 ----------
function text(s, x, y, o = {}) {
  const c = hctx; c.save();
  c.font = `${o.w || 600} ${o.size || 16}px ${o.mono ? MONO : FONT}`;
  c.textAlign = o.a || "left"; c.globalAlpha = o.alpha ?? 1;
  if (o.glow) { c.shadowColor = o.glow; c.shadowBlur = 10; }
  c.fillStyle = o.c || C.text; c.fillText(s, x, y); c.restore();
}
function chip(s, x, y, color, o = {}) {
  const c = hctx; c.save();
  c.font = `700 ${o.size || 14}px ${o.mono ? MONO : FONT}`;
  const w = c.measureText(s).width + 22, h = (o.size || 14) + 14;
  const bx = o.a === "center" ? x - w / 2 : o.a === "right" ? x - w : x;
  c.globalAlpha = o.alpha ?? 1;
  c.fillStyle = "rgba(5,7,13,.82)"; c.fillRect(bx, y - h / 2, w, h);
  c.strokeStyle = color; c.lineWidth = 1.5; c.shadowColor = color; c.shadowBlur = 8;
  c.strokeRect(bx + .5, y - h / 2 + .5, w - 1, h - 1);
  c.shadowBlur = 0; c.fillStyle = color; c.textBaseline = "middle"; c.fillText(s, bx + 11, y + 1);
  c.restore();
  return { x: bx, w, h };
}
function frame(title, tag) {
  const c = hctx; c.save(); c.strokeStyle = C.cyan; c.lineWidth = 2; c.globalAlpha = .8;
  const L = 18;
  [[12, 12, 1, 1], [W - 12, 12, -1, 1], [12, H - 12, 1, -1], [W - 12, H - 12, -1, -1]].forEach(([x, y, sx, sy]) => {
    c.beginPath(); c.moveTo(x, y + sy * L); c.lineTo(x, y); c.lineTo(x + sx * L, y); c.stroke();
  });
  c.restore();
  text(tag, 28, 40, { size: 12, mono: true, c: C.cyan, w: 500 });
  text(title, 28, 64, { size: 22, w: 700 });
}
const proj = (x, y, z) => { const v = new THREE.Vector3(x, y, z).project(camera); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };
function leader(from, to, color, alpha = 1) {
  const c = hctx; c.save(); c.globalAlpha = alpha; c.strokeStyle = color; c.fillStyle = color; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(from[0], from[1]); c.lineTo(to[0], to[1]); c.stroke();
  c.beginPath(); c.arc(from[0], from[1], 3, 0, Math.PI * 2); c.fill(); c.restore();
}
function meter(x, y, label, value, color) {
  text(label, x, y, { size: 12, c: C.dim, w: 500 });
  const c = hctx; c.save();
  c.strokeStyle = "rgba(232,246,255,.35)"; c.strokeRect(x + .5, y + 6.5, 150, 10);
  c.fillStyle = color; c.shadowColor = color; c.shadowBlur = 8; c.fillRect(x + 2, y + 8, 146 * clamp(value), 7);
  c.restore();
}

// ---------- 場景：GIF 2 閘極控制力（3D） ----------
const SCENES = {};
{
  const root = new THREE.Group();
  scene.add(root);
  const SUB = 0x0f1a2c, STI = 0x2a3a55, SI = 0x1d78c0, SD = 0x2a5fd0, GATE = 0xb02cc0;
  const L = 4.6; // 元件半長（z 方向，電流方向）
  const gateZ = 1.3, chZ = 3.1;

  // FinFET（左）
  const fx = -4.6;
  box(root, [fx - 3, -2, -L], [fx + 3, -1, L], SUB, { edge: 0x2c4a6e });
  box(root, [fx - 3, -1, -L], [fx + 3, 0, L], STI, { opacity: 0.3, edge: 0x4a6a95 });
  const fin = box(root, [fx - 0.5, -1, -chZ], [fx + 0.5, 3, chZ], SI, { edge: 0x4fc3ff, emissive: 0x0a3a66, ei: 0.4, opacity: 0.38 });
  const gateF = box(root, [fx - 1.9, 0, -gateZ], [fx + 1.9, 4, gateZ], GATE, { opacity: 0.32, edge: 0xff3df2, emissive: 0x6a0a78, ei: 0.5 });
  // 只畫後方的源極；前方汲極省略，讓鏡頭看得到通道切面
  box(root, [fx - 1.3, -0.1, -L], [fx + 1.3, 3.4, -chZ], SD, { opacity: 0.22, edge: 0x3a70c0 });

  // Nanosheet（右）
  const nx = 4.6;
  box(root, [nx - 3, -2, -L], [nx + 3, -1, L], SUB, { edge: 0x2c4a6e });
  box(root, [nx - 3, -1, -L], [nx + 3, 0, L], STI, { opacity: 0.3, edge: 0x4a6a95 });
  box(root, [nx - 0.6, -1, -chZ], [nx + 0.6, 0.2, chZ], SI, { edge: 0x4fc3ff, emissive: 0x0a3a66, ei: 0.3, opacity: 0.6 });
  const sheetsY = [1.0, 2.0, 3.0], sh = 0.5, sw = 1.5;
  sheetsY.forEach((y) => box(root, [nx - sw, y - sh / 2, -chZ], [nx + sw, y + sh / 2, chZ], SI, { edge: 0x4fc3ff, emissive: 0x0a3a66, ei: 0.4, opacity: 0.38 }));
  const gateN = box(root, [nx - 2.2, 0.3, -gateZ], [nx + 2.2, 4, gateZ], GATE, { opacity: 0.32, edge: 0xff3df2, emissive: 0x6a0a78, ei: 0.5 });
  box(root, [nx - 2, 0.3, -L], [nx + 2, 3.5, -chZ], SD, { opacity: 0.22, edge: 0x3a70c0 });

  const eOn = particles(420, 0x9ff8ff, 0.11);
  const eLeak = particles(60, 0xff4d5e, 0.12);
  const eRes = particles(240, 0x22c5ff, 0.07);

  const DUR = 6;
  const gateOn = (tt) => fract(tt / DUR) * DUR < 2.6;

  SCENES["02-gate-control-3d"] = {
    dur: DUR,
    render(t) {
      // 鏡頭慢慢左右擺動（首尾相接）
      const a = Math.sin((t / DUR) * Math.PI * 2) * 0.1 + 0.18;
      camera.position.set(Math.sin(a) * 22, 8.5, Math.cos(a) * 22);
      camera.lookAt(0, 0.4, 0);

      const tl = t % DUR;
      const on = tl < 2.6 ? 1 - ease((tl - 2.3) / 0.3) : ease((tl - 5.7) / 0.3);
      for (const g of [gateF, gateN]) {
        g.material.emissiveIntensity = 0.25 + 1.1 * on;
        g.material.opacity = 0.22 + 0.16 * on;
        g.userData.lines.material.opacity = 0.45 + 0.55 * on;
      }

      // 導通電子：閘極開啟時才進入通道
      const speed = 0.55, list = [];
      const stream = (n, seed, lane) => {
        for (let i = 0; i < n; i++) {
          const ph = fract(rnd(i + seed) + t * speed);
          if (!gateOn(t - ph / speed + DUR * 4)) continue;
          const [x, y] = lane(i + seed);
          list.push([x, y, lerp(-chZ, chZ, ph), 1]);
        }
      };
      stream(150, 0, (i) => [fx - 0.4 + rnd(i + 3) * 0.8, 0.15 + rnd(i + 5) * 2.7]);
      sheetsY.forEach((y, s) => stream(80, 500 + s * 97, (i) => [nx - sw + 0.1 + rnd(i + 3) * (sw * 2 - 0.2), y - 0.18 + rnd(i + 5) * 0.36]));
      place(eOn, list);

      // FinFET 底部漏電路徑：閘極管不到，一直有電子溜過
      const leak = [];
      for (let i = 0; i < 40; i++) {
        const ph = fract(rnd(i + 900) + t * speed);
        leak.push([fx - 0.4 + rnd(i + 901) * 0.8, -0.9 + rnd(i + 902) * 0.8, lerp(-chZ, chZ, ph), 1]);
      }
      place(eLeak, leak);
      eLeak.material.color.set(on > 0.5 ? 0x7ff6ff : 0xff4d5e);

      // 源極 / 汲極裡的電子
      const res = [];
      for (const [cx, w, y0, y1] of [[fx, 1.1, 0.1, 3.2], [nx, 1.8, 0.5, 3.3]]) {
        for (const zs of [-1]) {
          for (let i = 0; i < 60; i++) {
            const k = i + cx * 10 + zs * 300;
            res.push([cx - w + rnd(k) * 2 * w + Math.sin(t * 3 + i) * 0.05, y0 + rnd(k + 1) * (y1 - y0), zs * lerp(chZ + 0.15, L - 0.15, rnd(k + 2)) + Math.cos(t * 2.7 + i) * 0.05, 1]);
          }
        }
      }
      place(eRes, res);

      composer.render();

      // HUD
      hctx.clearRect(0, 0, W, H);
      frame("閘極控制力：3 面 vs 4 面 Gate Control", "NANOSHEET / 02 · 3D");
      const pf = proj(fx, 4.4, 0), pn = proj(nx, 4.4, 0);
      chip("FinFET｜閘極包 3 面", pf[0], pf[1] - 6, C.amber, { a: "center" });
      chip("Nanosheet｜閘極包 4 面", pn[0], pn[1] - 6, C.lime, { a: "center" });
      chip(on > 0.5 ? "GATE = ON（導通）" : "GATE = OFF（關閉）", 772, 40, on > 0.5 ? C.cyan : C.magenta, { a: "right", mono: true, size: 13 });

      const off = 1 - on;
      if (off > 0.05) {
        const lp = proj(fx, -0.5, chZ * 0.6);
        const c1 = chip("底部閘極管不到 → 漏電", 120, 380, C.red, { alpha: off });
        leader(lp, [c1.x + c1.w / 2, 380 - c1.h / 2], C.red, off);
        const np = proj(nx + sw, 2, chZ * 0.6);
        const c2 = chip("四面包住 → 完全關閉", 560, 380, C.lime, { alpha: off });
        leader(np, [c2.x + c2.w / 2, 380 - c2.h / 2], C.lime, off);
      } else {
        chip("導通：電子從後方源極沿通道流向鏡頭（前方汲極省略）", 400, 380, C.cyan, { a: "center" });
      }
      // 電流表
      meter(40, 412, "FinFET 電流", on > 0.5 ? 0.9 : 0.25, on > 0.5 ? C.cyan : C.red);
      meter(610, 412, "Nanosheet 電流", on > 0.5 ? 1 : 0.0, C.cyan);
      text(on > 0.5 ? "" : "關閉時仍有電流 = 漏電", 200, 425, { size: 12, c: C.red, w: 600, alpha: off });
    },
  };
}

window.SCENES = SCENES;
window.renderAt = (name, t) => {
  SCENES[name].render(t);
  octx.drawImage(glCanvas, 0, 0);
  octx.drawImage(hud, 0, 0);
  return out.toDataURL("image/png");
};
window.ready = document.fonts.ready.then(() => true);
const name = location.hash.slice(1);
if (name && SCENES[name]) {
  const t0 = performance.now();
  (function loop() { renderAt(name, ((performance.now() - t0) / 1000) % SCENES[name].dur); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
