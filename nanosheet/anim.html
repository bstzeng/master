<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>Nanosheet GIF renderer</title>
<style>
  body { margin: 0; background: #05070d; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="800" height="450"></canvas>
<script>
// 每張 GIF 一個場景：draw(ctx, t)，t 為 0..dur 秒，必須首尾銜接（循環播放）
const W = 800, H = 450;
const FONT = '"Noto Sans TC", "Noto Sans CJK TC", sans-serif';
const MONO = '"DejaVu Sans Mono", "DM Mono", monospace';
const C = {
  bg: "#05070d", grid: "rgba(34,229,255,.07)",
  cyan: "#22e5ff", magenta: "#ff3df2", lime: "#b6ff3d", red: "#ff4d5e", amber: "#ffb340",
  text: "#e8f6ff", dim: "rgba(232,246,255,.55)",
  si: "#1d6fa8", siLine: "#4fc3ff", sige: "#a8561d", sigeLine: "#ffa04d",
  gate: "#7a2d8f", gateLine: "#ff3df2", ox: "#ffd23d", sti: "#1a2230", stiLine: "#4a5b75",
  sub: "#0f1724", subLine: "#2c3b52", sd: "#163e7a", sdLine: "#5aa0ff",
};
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (k) => { k = clamp(k); return k * k * (3 - 2 * k); };
const fract = (v) => v - Math.floor(v);
const rnd = (i) => fract(Math.sin(i * 127.1 + 311.7) * 43758.5453);
const lerp = (a, b, k) => a + (b - a) * k;

function bg(ctx) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 40) { ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke(); }
}
function text(ctx, s, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.w || 600} ${o.size || 16}px ${o.mono ? MONO : FONT}`;
  ctx.textAlign = o.a || "left"; ctx.textBaseline = o.b || "alphabetic";
  ctx.globalAlpha = o.alpha ?? 1;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = 10; }
  ctx.fillStyle = o.c || C.text; ctx.fillText(s, x, y);
  ctx.restore();
}
// 霓虹方塊：半透明填色 + 發光邊框
function block(ctx, x, y, w, h, fill, line, o = {}) {
  ctx.save();
  ctx.globalAlpha = o.alpha ?? 1;
  ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = line; ctx.lineWidth = o.lw || 2;
  if (o.glow) { ctx.shadowColor = line; ctx.shadowBlur = o.glow; }
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  ctx.restore();
}
function dot(ctx, x, y, r, color, alpha = 1, blur = 10) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = blur;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
// HUD 角框
function hud(ctx, title, tag) {
  ctx.save(); ctx.strokeStyle = C.cyan; ctx.lineWidth = 2; ctx.globalAlpha = .8;
  const L = 18;
  [[12, 12, 1, 1], [W - 12, 12, -1, 1], [12, H - 12, 1, -1], [W - 12, H - 12, -1, -1]].forEach(([x, y, sx, sy]) => {
    ctx.beginPath(); ctx.moveTo(x, y + sy * L); ctx.lineTo(x, y); ctx.lineTo(x + sx * L, y); ctx.stroke();
  });
  ctx.restore();
  text(ctx, tag, 28, 40, { size: 12, mono: true, c: C.cyan, w: 500 });
  text(ctx, title, 28, 64, { size: 22, w: 700 });
}
function chip(ctx, s, x, y, color, o = {}) {
  ctx.save();
  ctx.font = `700 ${o.size || 15}px ${o.mono ? MONO : FONT}`;
  const w = ctx.measureText(s).width + 22, h = (o.size || 15) + 14;
  const bx = o.a === "center" ? x - w / 2 : o.a === "right" ? x - w : x;
  ctx.globalAlpha = o.alpha ?? 1;
  ctx.fillStyle = "rgba(5,7,13,.85)"; ctx.fillRect(bx, y - h / 2, w, h);
  ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.shadowColor = color; ctx.shadowBlur = 8;
  ctx.strokeRect(bx + .5, y - h / 2 + .5, w - 1, h - 1);
  ctx.shadowBlur = 0; ctx.fillStyle = color; ctx.textBaseline = "middle"; ctx.fillText(s, bx + 11, y + 1);
  ctx.restore();
}

const SCENES = {};

// ---------- GIF 0：電晶體就是開關 ----------
SCENES["00-switch"] = {
  dur: 4,
  draw(ctx, t) {
    bg(ctx);
    hud(ctx, "電晶體就是開關 Transistor = Switch", "NANOSHEET / 00");
    const on = (tt) => fract(tt / 4) < 0.5; // 前 2 秒開、後 2 秒關
    const isOn = on(t);
    const k = isOn ? ease((t % 4) / 0.25) : 1 - ease(((t % 4) - 2) / 0.25);
    // 結構（沿電流方向側視）
    const y0 = 250, ch = 46;
    block(ctx, 60, y0 + ch, 680, 90, C.sub, C.subLine);
    block(ctx, 80, y0 - 40, 180, ch + 40, C.sd, C.sdLine, { glow: 8 });
    block(ctx, 540, y0 - 40, 180, ch + 40, C.sd, C.sdLine, { glow: 8 });
    block(ctx, 260, y0, 280, ch, C.si, C.siLine);
    ctx.save(); ctx.globalAlpha = .9; ctx.fillStyle = C.ox; ctx.fillRect(270, y0 - 8, 260, 6); ctx.restore();
    block(ctx, 270, y0 - 100, 260, 92, C.gate, C.gateLine, { glow: 6 + 22 * k, lw: 2 + k });
    text(ctx, "源極 Source", 170, y0 - 52, { a: "center", size: 15, c: C.sdLine });
    text(ctx, "汲極 Drain", 630, y0 - 52, { a: "center", size: 15, c: C.sdLine });
    text(ctx, "閘極 Gate", 400, y0 - 50, { a: "center", size: 17, c: k > .5 ? "#fff" : C.dim });
    text(ctx, "↑ 通道 Channel", 400, y0 + ch + 24, { a: "center", size: 13, c: "rgba(232,246,255,.8)", w: 600 });
    text(ctx, "基板 Substrate", 400, y0 + ch + 66, { a: "center", size: 13, c: C.dim, w: 500 });
    // 閘極電場（開啟時往下打）
    for (let i = 0; i < 6; i++) {
      const ph = fract(t * 1.2 + i / 6);
      ctx.save(); ctx.globalAlpha = k * (1 - ph) * .8; ctx.strokeStyle = C.magenta; ctx.lineWidth = 2;
      ctx.shadowColor = C.magenta; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.moveTo(290, y0 - 4 + ph * 34); ctx.lineTo(510, y0 - 4 + ph * 34); ctx.stroke(); ctx.restore();
    }
    // 源極 / 汲極中的電子（一直都在）
    for (let i = 0; i < 26; i++) {
      for (const [x0, seed] of [[90, 0], [550, 100]]) {
        const x = x0 + 10 + rnd(i + seed) * 140 + Math.sin(t * 3 + i) * 4;
        const y = y0 - 26 + rnd(i + seed + 50) * (ch + 16) + Math.cos(t * 2.6 + i) * 4;
        dot(ctx, x, y, 3, C.cyan, .75, 6);
      }
    }
    // 通道中的電子：只在開啟時進入，關閉後跑完的離開
    const speed = 0.9;
    for (let i = 0; i < 34; i++) {
      const ph = fract(rnd(i + 7) + t * speed);
      const entered = t - ph / speed;
      if (!on(entered + 8)) continue;
      const x = lerp(240, 560, ph), y = y0 + 8 + rnd(i + 21) * (ch - 16);
      for (let j = 4; j >= 1; j--) dot(ctx, x - j * 7, y, 3 - j * .5, C.cyan, .18 * (5 - j) / 4, 0);
      dot(ctx, x, y, 3.6, "#9ff4ff", 1, 14);
    }
    // 位元顯示
    const bit = isOn ? "1" : "0", col = isOn ? C.lime : C.red;
    ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.shadowColor = col; ctx.shadowBlur = 14;
    ctx.strokeRect(640, 30, 120, 72); ctx.restore();
    text(ctx, bit, 680, 88, { size: 54, mono: true, c: col, glow: col, a: "center", w: 700 });
    text(ctx, isOn ? "ON" : "OFF", 735, 74, { size: 16, mono: true, c: col, a: "center" });
    chip(ctx, isOn ? "閘極加電壓 → 電子流過 = 1" : "閘極不加電壓 → 電子停住 = 0", 400, 405, col, { a: "center", size: 16 });
  },
};

// ---------- GIF 2：閘極控制力 3 面 vs 4 面 ----------
SCENES["02-gate-control"] = {
  dur: 5,
  draw(ctx, t) {
    bg(ctx);
    hud(ctx, "閘極控制力：3 面 vs 4 面 Gate Control", "NANOSHEET / 02");
    const off = ease((t - 0.8) / 0.4) * (1 - ease((t - 4.6) / 0.4)); // 關閉訊號強度
    ctx.save(); ctx.strokeStyle = "rgba(34,229,255,.25)"; ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.moveTo(400, 90); ctx.lineTo(400, 420); ctx.stroke(); ctx.restore();
    text(ctx, "FinFET｜3 面", 200, 104, { a: "center", size: 18, c: C.amber });
    text(ctx, "Nanosheet GAA｜4 面", 600, 104, { a: "center", size: 18, c: C.lime });
    const stiY = 320;
    // 波紋：從閘極面往通道內推
    const ripple = (x1, y1, x2, y2, nx, ny, depth) => {
      for (let i = 0; i < 3; i++) {
        const ph = fract(t * 1.1 + i / 3);
        const d = ph * depth;
        ctx.save(); ctx.globalAlpha = off * (1 - ph) * .9; ctx.strokeStyle = C.magenta; ctx.lineWidth = 2;
        ctx.shadowColor = C.magenta; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.moveTo(x1 + nx * d, y1 + ny * d); ctx.lineTo(x2 + nx * d, y2 + ny * d); ctx.stroke(); ctx.restore();
      }
    };
    // 通道載子：被電場清空；沒被包住的地方清不掉 → 漏電
    const carriers = (x, y, w, h, seedBase, clearedFn) => {
      let leak = 0;
      for (let i = 0; i < 60; i++) {
        const px = x + 4 + rnd(i + seedBase) * (w - 8) + Math.sin(t * 5 + i * 1.7) * 1.5;
        const py = y + 4 + rnd(i + seedBase + 300) * (h - 8) + Math.cos(t * 4.3 + i) * 1.5;
        const res = clearedFn(px, py);
        if (res === null) { // 清不掉
          leak++;
          const blink = .55 + .45 * Math.sin(t * 9 + i);
          dot(ctx, px, py, 3.2, off > .5 ? C.red : C.cyan, off > .5 ? blink : .85, 10);
        } else {
          const a = 1 - ease((off - res) / .25);
          if (a > 0) dot(ctx, px, py, 3, C.cyan, .85 * a, 6);
        }
      }
      return leak;
    };

    // ----- FinFET -----
    {
      const cx = 200, fw = 44, top = 150;
      block(ctx, 40, stiY + 50, 320, 50, C.sub, C.subLine);
      block(ctx, 40, stiY, 320, 50, C.sti, C.stiLine);
      // 閘極（3 面）
      block(ctx, cx - 110, top - 30, 220, stiY - top + 30, C.gate, C.gateLine, { glow: 6 + 16 * off });
      block(ctx, cx - fw / 2 - 6, top - 6, fw + 12, stiY - top + 6, C.ox, C.ox);
      block(ctx, cx - fw / 2, top, fw, stiY + 50 - top + 20, C.si, C.siLine);
      ripple(cx - fw / 2 - 6, top, cx - fw / 2 - 6, stiY, 1, 0, 22);
      ripple(cx + fw / 2 + 6, top, cx + fw / 2 + 6, stiY, -1, 0, 22);
      ripple(cx - fw / 2, top - 6, cx + fw / 2, top - 6, 0, 1, 40);
      const leak = carriers(cx - fw / 2, top, fw, stiY + 60 - top, 0, (px, py) => py > stiY - 4 ? null : clamp((py - top) / (stiY - top)) * .5);
      text(ctx, "STI", 70, stiY + 30, { size: 13, c: C.dim, mono: true });
      text(ctx, "Gate", cx, top - 8 - 4, { a: "center", size: 14, c: "#fff" });
      if (off > .5) {
        ctx.save(); ctx.strokeStyle = C.red; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.5;
        ctx.strokeRect(cx - fw / 2 - 8, stiY - 6, fw + 16, 82); ctx.restore();
        chip(ctx, "底部沒包住 → 漏電", cx, 410, C.red, { a: "center", size: 14, alpha: off });
      }
    }
    // ----- Nanosheet -----
    {
      const cx = 600, sw = 110, sh = 20, gap = 30, top = 160;
      block(ctx, 440, stiY + 50, 320, 50, C.sub, C.subLine);
      block(ctx, 440, stiY, 320, 50, C.sti, C.stiLine);
      block(ctx, cx - 25, stiY, 50, 50, C.si, C.siLine);
      block(ctx, cx - 100, top - 40, 200, stiY - top + 40, C.gate, C.gateLine, { glow: 6 + 16 * off });
      text(ctx, "Gate", cx, top - 18, { a: "center", size: 14, c: "#fff" });
      for (let s = 0; s < 3; s++) {
        const y = top + s * (sh + gap);
        block(ctx, cx - sw / 2 - 6, y - 6, sw + 12, sh + 12, C.ox, C.ox);
        block(ctx, cx - sw / 2, y, sw, sh, C.si, C.siLine);
        ripple(cx - sw / 2, y - 6, cx + sw / 2, y - 6, 0, 1, sh / 2 + 4);
        ripple(cx - sw / 2, y + sh + 6, cx + sw / 2, y + sh + 6, 0, -1, sh / 2 + 4);
        ripple(cx - sw / 2 - 6, y, cx - sw / 2 - 6, y + sh, 1, 0, 14);
        ripple(cx + sw / 2 + 6, y, cx + sw / 2 + 6, y + sh, -1, 0, 14);
        carriers(cx - sw / 2, y, sw, sh, 1000 + s * 77, () => .3);
      }
      if (off > .5) chip(ctx, "四面包住 → 完全關閉", cx, 410, C.lime, { a: "center", size: 14, alpha: off });
    }
    // 狀態列
    const state = off > .5 ? "GATE = OFF（關閉）" : "GATE = ON（導通）";
    chip(ctx, state, 772, 40, off > .5 ? C.magenta : C.cyan, { a: "right", size: 13, mono: true });
    text(ctx, "剖面：從電流方向看進去（電流垂直於畫面） · 藍點 = 可導電的電子", 400, 440, { a: "center", size: 12, c: C.dim, w: 500 });
    if (off < .5) chip(ctx, "導通：通道裡充滿電子", 400, 410, C.cyan, { a: "center", size: 14 });
  },
};

// 匯出給錄製程式
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
window.SCENES = SCENES;
window.renderAt = (name, t) => { ctx.setTransform(1, 0, 0, 1, 0, 0); SCENES[name].draw(ctx, t); return canvas.toDataURL("image/png"); };
// 預覽：anim.html#00-switch
const name = location.hash.slice(1);
if (name && SCENES[name]) { const t0 = performance.now(); (function loop() { renderAt(name, ((performance.now() - t0) / 1000) % SCENES[name].dur); requestAnimationFrame(loop); })(); }
</script>
</body>
</html>
